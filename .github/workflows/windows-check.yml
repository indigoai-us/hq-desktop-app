# Windows compile gate for the unified sync app (Phase 3 of MIGRATION.md).
#
# Cross-compiling a Tauri app for Windows cannot be verified on a macOS dev box
# (the per-target Recall sidecar binary and the MSVC toolchain are absent), so
# this is the authoritative feedback loop for the `cfg(target_os = "windows")`
# platform graft. It is EXPECTED TO BE RED until the platform-seam port in
# PHASE3.md is complete; it becomes a required check once green.
#
# Triggers on PRs that touch the app (not push to main) so main is not shown red
# while the fold is in progress; also manually dispatchable.
name: Windows check (Phase 3)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/sync/**"
      - "imports/hq-installer-react/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "versions.toml"
      - "scripts/release-*.mjs"
      - "scripts/release-*.test.ts"
      - "scripts/windows-msi-version.mjs"
      - "scripts/windows-msi-version.test.ts"
      - ".github/workflows/release.yml"
      - ".github/workflows/windows-check.yml"

jobs:
  windows-check:
    name: cargo check (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/sync
    env:
      RUST_BACKTRACE: 1
      HQ_SYNC_SENTRY_DSN: ""

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Version comes from the root package.json "packageManager" field;
      # passing an explicit version here too is rejected as a conflict.
      - uses: pnpm/action-setup@v4

      - name: Install Rust (stable, x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/sync/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/sync/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install JS deps
        run: pnpm install --no-frozen-lockfile

      - name: Install Recall sidecar deps (build.rs resource)
        run: pnpm run sidecar:install

      - name: Build Svelte bundle (satisfies tauri frontendDist)
        run: pnpm run build

      - name: Rust check (Windows target)
        working-directory: apps/sync/src-tauri
        run: cargo check --target x86_64-pc-windows-msvc

      - name: Windows tests
        timeout-minutes: 30
        working-directory: apps/sync/src-tauri
        run: cargo test --target x86_64-pc-windows-msvc --bins

      # These regressions force each Job Object attachment failure and then let
      # the real production pid-tree fallback run: they assert that a real child
      # and its real descendants disappeared, that nothing outside that tree was
      # touched, and that a failed root termination stays alertable. They get
      # their own bounded step so the proof is a named gate rather than a line
      # buried in the full run.
      - name: Windows Job attachment failure regressions
        timeout-minutes: 15
        working-directory: apps/sync/src-tauri
        run: cargo test --target x86_64-pc-windows-msvc --bins commands::process::windows_job_attachment_failure_tests -- --nocapture

      # The base half is deliberately a red proof: it materializes this PR's
      # merge-base in a CI-local worktree and requires the legacy manual-sync
      # decision seam to report capture for code 1/no signal.
      - name: Base sync cancellation red proof
        timeout-minutes: 12
        working-directory: .
        run: node scripts/sync-cancel-base-probe.mjs

      # Runs a feature-gated path in the real menubar binary. The probe starts
      # a fixture child through the production registry, performs a generation-
      # aware Windows cancellation, and must observe the actual code-1 exit as
      # an effective timeout cancellation that suppresses capture.
      - name: Candidate sync cancellation artifact probe
        timeout-minutes: 15
        working-directory: apps/sync/src-tauri
        shell: pwsh
        run: |
          cargo build --target x86_64-pc-windows-msvc --features sync-cancel-probe
          $raw = & .\target\x86_64-pc-windows-msvc\debug\hq-sync-menubar.exe --sync-cancel-probe | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) { throw "sync-cancel probe failed with exit code $LASTEXITCODE" }
          $probe = $raw | ConvertFrom-Json
          if ($probe.exit_code -ne 1 -or $probe.cause -ne "timeout-watchdog" -or -not $probe.terminated -or $probe.decision -ne "suppress") {
            throw "unexpected sync-cancel probe result: $raw"
          }

      # Both sides of the `e2e-automation` gate are covered: the default run
      # above proves a shipped build cannot read
      # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS at all, and this run proves the CI
      # build still forwards it. Testing one configuration would leave the
      # other free to rot.
      - name: Windows app tests (e2e automation)
        working-directory: apps/sync/src-tauri
        run: cargo test --target x86_64-pc-windows-msvc --bins --features e2e-automation

      # Keep each native command in its own step. PowerShell otherwise continues
      # after a failed native command and can falsely report success when a
      # later focused test passes.
      - name: Windows path tests
        working-directory: apps/sync/src-tauri
        run: cargo test --manifest-path ../../../crates/hq-desktop-core/Cargo.toml paths::tests::test_windows

      - name: HQ CLI update tests
        working-directory: apps/sync/src-tauri
        run: cargo test --manifest-path ../../../crates/hq-desktop-core/Cargo.toml hq_cli_update::tests

      - name: HQ resolver tests
        working-directory: apps/sync/src-tauri
        run: cargo test --manifest-path ../../../crates/hq-desktop-core/Cargo.toml hq_resolver::tests

      - name: Sync outcome tests
        working-directory: apps/sync/src-tauri
        run: cargo test --manifest-path ../../../crates/hq-desktop-core/Cargo.toml sync_outcome::tests

      - name: Runtime diagnosis tests
        working-directory: apps/sync/src-tauri
        run: cargo test --manifest-path ../../../crates/hq-desktop-core/Cargo.toml runtime_diagnosis::tests

      - name: Provision telemetry envelope tests
        working-directory: apps/sync/src-tauri
        run: cargo test --target x86_64-pc-windows-msvc --bins commands::run_cli_provision::tests

      # The missing-Node capture proof asserts envelope COUNTS through the real
      # `hq_telemetry::before_send` pipeline — including that a proven
      # user-owned runtime gap emits none. Windows resolves `npx.cmd` through a
      # different branch of `paths::resolve_bin` than macOS, so the provenance
      # and bare-name checks that scope the downgrade have to be exercised on
      # the msvc target too rather than inferred from the macOS run.
      - name: Missing-Node capture envelope tests
        working-directory: apps/sync/src-tauri
        run: cargo test --manifest-path ../../../crates/hq-telemetry/Cargo.toml --test provision_missing_node_capture_e2e

      # The Connect self-repair policy decides whether HQ downloads a Node
      # runtime. Its bound (one repair, one retry) is what stops a machine that
      # cannot install Node from looping on the download, so it is verified on
      # every target the app ships to.
      - name: Connect managed-Node self-repair tests
        working-directory: apps/sync/src-tauri
        run: cargo test --target x86_64-pc-windows-msvc --bins commands::workspaces::node_self_repair_tests

      # The bulk-delete refusal gate persists its per-root cooldown anchor with
      # `fs::write` of a temp file plus `fs::rename` over an existing
      # destination inside the `.git` directory. Rename-over-existing is the one
      # genuinely platform-sensitive operation in this module, and `cargo check`
      # never builds `#[cfg(test)]` code — so without this step the persistence
      # path ships to the Windows fleet (which produced the tightest observed
      # refusal flood) having never been executed on the msvc target.
      - name: Git mirror tests
        working-directory: apps/sync/src-tauri
        run: cargo test --manifest-path ../../../crates/hq-desktop-core/Cargo.toml git_mirror::tests

      - name: Install Tauri WebDriver bridge
        run: cargo install tauri-driver --locked

      # The runner's preinstalled Edge WebDriver tracks the Edge browser, not
      # the WebView2 runtime the app embeds; when they drift by a major version
      # session creation fails ("only supports Microsoft Edge version N").
      # Install a driver matched to the runtime and shadow the preinstalled one.
      - name: Install msedgedriver matching the WebView2 runtime
        shell: pwsh
        run: scripts/ensure-msedgedriver.ps1

      # `--features e2e-automation` compiles in the WebView2 automation bridge
      # (src-tauri/src/util/webview2_automation.rs) that forwards msedgedriver's
      # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS into the app's webviews. It is off
      # in every shipped build — honouring that user-writable variable in a
      # release would let any local process turn the next launch into a CDP
      # listener reaching the Tauri command surface — so the binary driven below
      # differs from the one users install by exactly that gate.
      - name: Build launchable Windows app
        run: pnpm tauri build --debug --no-bundle --target x86_64-pc-windows-msvc --config src-tauri/tauri.windows.conf.json --features e2e-automation

      # HQ-DESKTOP-44. The only artifact-level proof that a Windows session end
      # no longer aborts the app: it launches the real binary and sends it
      # WM_QUERYENDSESSION then WM_ENDSESSION(TRUE) followed by an ordinary
      # posted message — the exact sequence that latches tao's event-loop runner
      # into `Destroyed` and then dispatches into it. A real logoff is not used;
      # it would take the runner down with it and prove less.
      #
      # Runs BEFORE the pre-auth smoke test on purpose: `tauri_plugin_single_instance`
      # folds a second launch into an already-running process, so these two must
      # never have an app up at the same time. Not conditional and never
      # continue-on-error — this job builds the binary, so the spec can always
      # run, and a skip would read as a pass.
      - name: Live Windows session-end proof
        env:
          HQ_SYNC_DESKTOP_ALT_LIVE: "1"
          HQ_SYNC_WINDOWS_SESSION_END_LIVE: "1"
          HQ_SYNC_DESKTOP_ALT_APP: ${{ github.workspace }}\apps\sync\src-tauri\target\x86_64-pc-windows-msvc\debug\hq-sync-menubar.exe
        run: pnpm vitest run --config e2e/desktop-alt/vitest.config.ts e2e/desktop-alt/windows-session-end.spec.ts

      # Defence in depth for the single-instance constraint above: if the
      # session-end spec failed mid-run it may have left the app up, which would
      # silently fold the next launch into it.
      - name: Stop any stray app instance
        if: always()
        shell: pwsh
        run: Get-Process hq-sync-menubar -ErrorAction SilentlyContinue | Stop-Process -Force

      # Signed-out by design: a GitHub runner has no Cognito session, and the
      # honest alternatives (a fabricated token, a CI login secret, or loosening
      # the gate) would each destroy the thing under test. The spec asserts what
      # a signed-out machine really reaches — the app boots, the popover paints,
      # and the desktop-alt gate refuses. The signed-in surfaces stay covered by
      # the scripted `Desktop-alt E2E` job (smoke-pages.spec.ts).
      - name: Live Windows pre-auth smoke test
        env:
          HQ_SYNC_DESKTOP_ALT_LIVE: "1"
          HQ_SYNC_DESKTOP_ALT_APP: ${{ github.workspace }}\apps\sync\src-tauri\target\x86_64-pc-windows-msvc\debug\hq-sync-menubar.exe
          HQ_SYNC_DESKTOP_ALT_DRIVER_LOG_DIR: ${{ runner.temp }}\desktop-alt-driver-logs
        run: pnpm vitest run --config e2e/desktop-alt/vitest.config.ts e2e/desktop-alt/live-preauth.spec.ts

      # always(), not failure(): the captured msedgewebview2.exe command line is
      # the evidence that the WebView2 automation switches landed, and a green
      # run is exactly when that evidence is worth keeping.
      - name: Upload WebDriver diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-check-webdriver-logs
          if-no-files-found: warn
          path: ${{ runner.temp }}/desktop-alt-driver-logs/**

      # Enabled after the existing warning backlog is cleaned up:
      # - name: Clippy (deny warnings)
      #   working-directory: apps/sync/src-tauri
      #   run: cargo clippy --target x86_64-pc-windows-msvc -- -D warnings

  windows-installer-e2e:
    name: installer E2E (x64 MSI + NSIS)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/sync
    env:
      RUST_BACKTRACE: 1
      HQ_SYNC_SENTRY_DSN: ""
      RECALL_SIDECAR_TARGET: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4

      - name: Install Rust (stable, x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/sync/src-tauri/target
          key: ${{ runner.os }}-installer-cargo-${{ hashFiles('apps/sync/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-installer-cargo-
            ${{ runner.os }}-cargo-

      - name: Install JS deps
        run: pnpm install --no-frozen-lockfile

      - name: Install Recall sidecar deps
        run: pnpm run sidecar:install

      - name: Install Tauri WebDriver bridge
        run: cargo install tauri-driver --locked

      # The runner's preinstalled Edge WebDriver tracks the Edge browser, not
      # the WebView2 runtime the app embeds; when they drift by a major version
      # session creation fails ("only supports Microsoft Edge version N").
      # Install a driver matched to the runtime and shadow the preinstalled one.
      - name: Install msedgedriver matching the WebView2 runtime
        shell: pwsh
        run: scripts/ensure-msedgedriver.ps1

      # Same flag as the windows-check job: `e2e-automation` is what lets
      # msedgedriver attach, and it is never on in a shipped build. The honest
      # consequence is that this job packages and installs a binary that is NOT
      # byte-identical to the released one — it differs by that one feature.
      # `cfg!(debug_assertions)` could not have been the gate instead: this is a
      # release build.
      - name: Generate Windows MSI version overlay
        shell: pwsh
        run: |
          $appVersion = node -p "require('./package.json').version"
          $configPath = Join-Path $env:RUNNER_TEMP "tauri.windows.msi-version.conf.json"
          node ../../scripts/windows-msi-version.mjs --version $appVersion --output $configPath
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to generate Windows MSI version overlay"
          }
          "TAURI_MSI_VERSION_CONFIG=$configPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build production MSI and NSIS installers
        run: >-
          pnpm tauri build
          --target x86_64-pc-windows-msvc
          --bundles msi nsis
          --config src-tauri/tauri.windows.conf.json
          --config src-tauri/tauri.windows.release.conf.json
          --config src-tauri/tauri.windows.ci.conf.json
          --config $env:TAURI_MSI_VERSION_CONFIG
          --features e2e-automation

      - name: Install Sentry CLI
        shell: pwsh
        run: npm install --global @sentry/cli@3.6.2

      # Exercise the release-profile symbol contract on every PR that changes
      # the release workflow. The e2e feature changes the binary's debug id,
      # but the executable and its PDB must still carry the same id.
      - name: Verify installer debug file contract
        shell: pwsh
        run: |
          $releaseDir = "src-tauri\target\x86_64-pc-windows-msvc\release"
          $exe = Join-Path $releaseDir "hq-sync-menubar.exe"
          $pdb = Join-Path $releaseDir "hq_sync_menubar.pdb"
          if (-not (Test-Path $exe)) {
            throw "Required installer executable is missing: $exe"
          }
          if (-not (Test-Path $pdb)) {
            throw "Required installer PDB is missing: $pdb"
          }
          $exeMetadata = (& sentry-cli difutil check --json $exe | ConvertFrom-Json)
          $pdbMetadata = (& sentry-cli difutil check --json $pdb | ConvertFrom-Json)
          $exeDebugId = @($exeMetadata.variants | ForEach-Object { $_.debug_id } | Where-Object { $_ } | Sort-Object -Unique) -join ","
          $pdbDebugId = @($pdbMetadata.variants | ForEach-Object { $_.debug_id } | Where-Object { $_ } | Sort-Object -Unique) -join ","
          if (-not $exeDebugId -or -not $pdbDebugId -or $exeDebugId -ne $pdbDebugId) {
            throw "Installer executable and PDB debug ids differ: exe=$exeDebugId pdb=$pdbDebugId"
          }
          Write-Host "Installer executable/PDB debug id: $exeDebugId"

      - name: Verify prerelease MSI package
        shell: pwsh
        run: |
          $msi = Get-ChildItem "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\msi\*.msi" -File -ErrorAction SilentlyContinue
          if (-not $msi) {
            throw "Tauri did not produce the required prerelease MSI package"
          }
          $msi | ForEach-Object { Write-Host "Built MSI: $($_.Name)" }

      - name: Install production package
        id: install
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis" -Filter '*-setup.exe' -File -ErrorAction Stop | Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer was not produced"
          }

          $installDir = Join-Path $env:RUNNER_TEMP "hq-installer-e2e"
          $app = & "scripts\windows-installer-e2e.ps1" -Action install -InstallerPath $installer.FullName -InstallDir $installDir

          "app=$app" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Installed application: $app"

      # Same pre-auth scope as the windows-check job, against the installed
      # production package rather than a debug build.
      - name: Live pre-auth smoke test of the installed application
        env:
          HQ_SYNC_DESKTOP_ALT_LIVE: "1"
          HQ_SYNC_DESKTOP_ALT_APP: ${{ steps.install.outputs.app }}
          HQ_SYNC_DESKTOP_ALT_DRIVER_LOG_DIR: ${{ runner.temp }}\desktop-alt-driver-logs
        run: pnpm vitest run --config e2e/desktop-alt/vitest.config.ts e2e/desktop-alt/live-preauth.spec.ts

      - name: List installed files on failure
        if: failure()
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "hq-installer-e2e"
          if (Test-Path -LiteralPath $installDir) {
            Get-ChildItem -LiteralPath $installDir -Recurse | Select-Object FullName, Length, LastWriteTime | Format-Table -AutoSize
          }

      # Two steps, not one path list: upload-artifact derives a single root
      # directory from the paths it is given, and these two live on different
      # roots (the runner's home vs. RUNNER_TEMP). Listing both under one step
      # fails with "The rootDirectory ... is not a parent directory of the file".
      - name: Upload application logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-e2e-app-logs
          if-no-files-found: warn
          path: ~/.hq/logs/**

      - name: Upload WebDriver diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-e2e-webdriver-logs
          if-no-files-found: warn
          path: ${{ runner.temp }}/desktop-alt-driver-logs/**

      - name: Uninstall production package
        if: always()
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "hq-installer-e2e"
          & "scripts\windows-installer-e2e.ps1" -Action uninstall -InstallDir $installDir
