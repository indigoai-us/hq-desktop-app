# Windows compile gate for the unified sync app (Phase 3 of MIGRATION.md).
#
# Cross-compiling a Tauri app for Windows cannot be verified on a macOS dev box
# (the per-target Recall sidecar binary and the MSVC toolchain are absent), so
# this is the authoritative feedback loop for the `cfg(target_os = "windows")`
# platform graft. It is EXPECTED TO BE RED until the platform-seam port in
# PHASE3.md is complete; it becomes a required check once green.
#
# Triggers on PRs (not push to main) so main is not shown red while the fold is
# in progress; also manually dispatchable. There is deliberately no `branches:`
# filter, so a stacked PR opened against a non-main base runs this gate too --
# see the trigger-contract comment in ci.yml. `edited` is in `types:` because a
# base retarget fires only that event. A title/body edit therefore also starts
# this workflow; that is accepted rather than gated on
# `github.event.changes.base`, because a job skipped by an `if:` reports Success
# and would turn a red required check green on a title typo (same trap as the
# path-filter note above).
#
# The relevant-paths list is NOT a `paths:` trigger filter. Both jobs here are
# REQUIRED status checks, and GitHub leaves a required context of a
# path-filtered workflow pending forever ("Expected — Waiting for status to be
# reported") on any pull request that does not match, so such a PR can never
# merge. A job skipped by a job-level `if:` reports Success instead. The
# workflow therefore runs on every pull request and the two expensive
# windows-latest jobs are gated on the `changes` job below, which applies the
# same path list via scripts/windows-check-relevant.mjs. No PR that used to run
# the gate stops running it; irrelevant PRs get a green skip that costs no
# Windows minutes instead of an eternal pending.
name: Windows check (Phase 3)

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

# A pull_request workflow with no concurrency group keeps burning Windows
# minutes (2x) on commits the branch has already moved past. Measured over 30
# days, 153 of 689 runs here were still executing when a newer push superseded
# them. Mirrors the group ci.yml already declares.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# rust-cache hashes CARGO_* env vars into the cache key. Must match
# cache-warm.yml so PRs restore the main-branch cache.
env:
  CARGO_TERM_COLOR: always

jobs:
  # Cheap ubuntu gate that decides whether the two windows-latest jobs below
  # have anything to check. A manual dispatch always runs them.
  changes:
    name: Windows-relevant changes
    runs-on: ubuntu-latest
    # A checkout and a path diff; healthy runs finish in about six seconds.
    # Every downstream Windows job needs this one's output, so a stall here
    # stalls the whole workflow -- and it is the gate's own required check.
    timeout-minutes: 10
    outputs:
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether the Windows gate applies
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail

          # Anything that is not a pull request (workflow_dispatch) runs the
          # full gate: there is no diff to scope it to.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "windows=true" >>"$GITHUB_OUTPUT"
            echo "not a pull_request — running the Windows gate"
            exit 0
          fi

          # An undeterminable diff must run the gate, never skip it. The
          # matcher treats an empty list the same way; this branch just keeps a
          # git failure from being reported as "nothing changed".
          if ! changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"; then
            echo "windows=true" >>"$GITHUB_OUTPUT"
            echo "could not diff $BASE_SHA...$HEAD_SHA — running the Windows gate"
            exit 0
          fi

          printf '%s\n' "$changed"
          verdict="$(printf '%s\n' "$changed" | node scripts/windows-check-relevant.mjs)"

          # Same failure direction as the matcher itself: only an explicit
          # "false" skips the gate. A crashed matcher must not read as "nothing
          # to check".
          if [ "$verdict" != "false" ]; then
            verdict=true
          fi

          echo "windows=$verdict" >>"$GITHUB_OUTPUT"
          echo "Windows gate applies: $verdict"

  # This gate used to be one 46-step job called `cargo check`, which was
  # misleading in both directions: the literal `cargo check` step takes about a
  # minute, and the other ~24 were a Windows test and live-app suite riding
  # along behind that name. Measured on run 33634531610 the job took 24m13s
  # while the installer chain beside it took 17m -- so this single job, not the
  # release builds, was what set how long a PR waited.
  #
  # The steps are independent: none consumes another's output, so they were
  # serial only because they shared a runner. They now run as three jobs split
  # along what each one has to BUILD, which is where the time actually goes:
  #
  #   windows-check-crates  root workspace only, no app build   (~7.8 min)
  #   windows-check-app     app bins, default features          (~8.1 min)
  #   windows-check-live    app bins, two extra feature sets    (~11.5 min)
  #
  # Critical path becomes the longest of the three rather than the sum, so the
  # gate lands near 11.5 minutes and stops being the PR bottleneck. The extra
  # cost is two more runner prologues (~90s each); this repository is public,
  # so standard runners are free and that trade is pure wall-clock win.
  #
  # Splitting by feature set is not cosmetic. Changing cargo features
  # invalidates the dependency graph, so the old job compiled the app four
  # separate times -- default, sync-cancel-probe, e2e-automation, and the
  # launchable tauri build -- each partly undoing the last. Grouping the two
  # feature-flagged builds into one job keeps that churn on a single runner
  # instead of interleaving it with the default-feature suite.

  windows-check-crates:
    needs: changes
    if: ${{ needs.changes.outputs.windows == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    name: Windows crate tests (shared crates on msvc)
    runs-on: windows-latest
    # Its own compile plus ~200s of tests; git_mirror alone is ~3m15s.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/sync
    env:
      RUST_BACKTRACE: 1
      HQ_SYNC_SENTRY_DSN: ""

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Version comes from the root package.json "packageManager" field;
      # passing an explicit version here too is rejected as a conflict.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/sync/pnpm-lock.yaml

      - name: Install Rust (stable, x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      # rust-cache prunes to the registry plus dependency artifacts and covers
      # BOTH workspaces. shared-key is shared with cache-warm.yml on main so
      # new PRs restore from main instead of starting cold, and so PRs with an
      # exact hit do not each save their own copy.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/sync/src-tauri
          shared-key: windows-check-debug
          # This job is red ~15% of the time and the compile step that fills
          # the cache runs BEFORE the tests that fail. rust-cache defaults to
          # cache-on-failure:false, so those runs discard valid dependency
          # artifacts and the next run starts cold again.
          cache-on-failure: true
          # One writer only. This job compiles the root workspace; windows-check-app
          # compiles the app workspace and saves the shared entry for both. Two
          # writers under one key just race, and a second key would double the
          # footprint against an already-oversubscribed 10 GB repo budget.
          save-if: false

      - name: Install JS deps
        run: pnpm install --no-frozen-lockfile

      # HQ-DESKTOP-4X. The pure fault-attribution core: the faulting-binary
      # allow-list, the WER Application Error 1000 XML parse, the pid/window/
      # no_record/unavailable provenance decision, and the unmatched-stderr shape
      # rollup — all content-safe and platform-independent, so they run as their
      # own named gate rather than being buried in the full core run.
      - name: Watcher fault provenance core tests
        working-directory: apps/sync/src-tauri
        run: cargo test --manifest-path ../../../crates/hq-desktop-core/Cargo.toml watcher_fault::tests

      # The independent hq-telemetry egress allow-list for every new fault field:
      # each survives before_send when valid and degrades to [Filtered] when a
      # producer bug would ship a path or raw byte (the PR #397 blanking failure
      # mode), with a cross-crate anti-drift pin on the token vocabulary.
      - name: Watcher fault telemetry egress tests
        working-directory: apps/sync/src-tauri
        run: cargo test --manifest-path ../../../crates/hq-telemetry/Cargo.toml watcher_fault

      # Keep each native command in its own step. PowerShell otherwise continues
      # after a failed native command and can falsely report success when a
      # later focused test passes.
      - name: Windows path tests
        working-directory: apps/sync/src-tauri
        run: cargo test --manifest-path ../../../crates/hq-desktop-core/Cargo.toml paths::tests::test_windows

      - name: HQ CLI update tests
        working-directory: apps/sync/src-tauri
        run: cargo test --manifest-path ../../../crates/hq-desktop-core/Cargo.toml hq_cli_update::tests

      - name: HQ resolver tests
        working-directory: apps/sync/src-tauri
        run: cargo test --manifest-path ../../../crates/hq-desktop-core/Cargo.toml hq_resolver::tests

      - name: Sync outcome tests
        working-directory: apps/sync/src-tauri
        run: cargo test --manifest-path ../../../crates/hq-desktop-core/Cargo.toml sync_outcome::tests

      - name: Runtime diagnosis tests
        working-directory: apps/sync/src-tauri
        run: cargo test --manifest-path ../../../crates/hq-desktop-core/Cargo.toml runtime_diagnosis::tests

      # The missing-Node capture proof asserts envelope COUNTS through the real
      # `hq_telemetry::before_send` pipeline — including that a proven
      # user-owned runtime gap emits none. Windows resolves `npx.cmd` through a
      # different branch of `paths::resolve_bin` than macOS, so the provenance
      # and bare-name checks that scope the downgrade have to be exercised on
      # the msvc target too rather than inferred from the macOS run.
      - name: Missing-Node capture envelope tests
        working-directory: apps/sync/src-tauri
        run: cargo test --manifest-path ../../../crates/hq-telemetry/Cargo.toml --test provision_missing_node_capture_e2e

      # The index-lock over-reporting fix bills at most one warning per wedge
      # episode and demotes the self-heal notice to Info. The `fs::remove_file`
      # fails branch — an unrecoverable wedge whose lock another process still
      # holds — is the Windows-specific route into the warning path, so the
      # envelope proof runs on the msvc target too rather than being inferred from
      # the Linux `cargo test -p hq-telemetry` job.
      - name: Index-lock episode capture envelope tests
        working-directory: apps/sync/src-tauri
        run: cargo test --manifest-path ../../../crates/hq-telemetry/Cargo.toml --test index_lock_episode_capture_e2e

      # The bulk-delete refusal gate persists its per-root cooldown anchor with
      # `fs::write` of a temp file plus `fs::rename` over an existing
      # destination inside the `.git` directory. Rename-over-existing is the one
      # genuinely platform-sensitive operation in this module, and `cargo check`
      # never builds `#[cfg(test)]` code — so without this step the persistence
      # path ships to the Windows fleet (which produced the tightest observed
      # refusal flood) having never been executed on the msvc target.
      - name: Git mirror tests
        working-directory: apps/sync/src-tauri
        run: cargo test --manifest-path ../../../crates/hq-desktop-core/Cargo.toml git_mirror::tests

      # The runner-target probe has a Windows-specific arm: there is no POSIX
      # mode bit, so executability is never asserted and "exists" means any of
      # npm's `.cmd`/`.ps1`/extensionless shims. That arm compiles under the
      # `cargo check --target` above but only *runs* here, and getting it wrong
      # would report a healthy Windows cache as Missing.
      - name: Runner target probe tests
        working-directory: apps/sync/src-tauri
        run: cargo test --manifest-path ../../../crates/hq-desktop-core/Cargo.toml runner_target::tests

  # Everything that runs against the app's bins under DEFAULT features, so the
  # binaries built by `cargo test --bins --no-run` below are compiled once and
  # reused by every step after it. `Rust check` is kept rather than folded into
  # that build: `cargo check` compiles in non-test mode, so it is the only step
  # that would catch a `#[cfg(not(test))]` block failing to compile.
  windows-check-app:
    needs: changes
    if: ${{ needs.changes.outputs.windows == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    name: Windows app tests (msvc bins)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/sync
    env:
      RUST_BACKTRACE: 1
      HQ_SYNC_SENTRY_DSN: ""

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Version comes from the root package.json "packageManager" field;
      # passing an explicit version here too is rejected as a conflict.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/sync/pnpm-lock.yaml

      - name: Install Rust (stable, x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      # rust-cache prunes to the registry plus dependency artifacts and covers
      # BOTH workspaces. shared-key is shared with cache-warm.yml on main so
      # new PRs restore from main instead of starting cold, and so PRs with an
      # exact hit do not each save their own copy.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/sync/src-tauri
          shared-key: windows-check-debug
          # This job is red ~15% of the time and the compile step that fills
          # the cache runs BEFORE the tests that fail. rust-cache defaults to
          # cache-on-failure:false, so those runs discard valid dependency
          # artifacts and the next run starts cold again.
          cache-on-failure: true

      - name: Install JS deps
        run: pnpm install --no-frozen-lockfile

      - name: Install Recall sidecar deps (build.rs resource)
        run: pnpm run sidecar:install

      - name: Build Svelte bundle (satisfies tauri frontendDist)
        run: pnpm run build

      - name: Rust check (Windows target)
        working-directory: apps/sync/src-tauri
        run: cargo check --target x86_64-pc-windows-msvc

      # `cargo check` deliberately does not build cfg(test) code or
      # dev-dependencies. Compile and link the test binaries in their own
      # named gate so a cold cache cannot look like a stuck test harness.
      # This also keeps the execution gate below a genuine five-minute
      # deadlock detector: the broad suite normally executes in under a minute.
      - name: Build Windows test binaries
        timeout-minutes: 30
        working-directory: apps/sync/src-tauri
        run: cargo test --target x86_64-pc-windows-msvc --bins --no-run

      # The runner's outer timeout did not reap a stranded cargo child tree on
      # live run 33461363416. Keep it as a secondary boundary, but let the
      # process-level watchdog enforce the real five-minute test deadline.
      - name: Windows tests (process-tree watchdog)
        timeout-minutes: 7
        working-directory: apps/sync/src-tauri
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE/scripts/windows-test-watchdog.ps1" -TimeoutSeconds 300'

      # These regressions force each Job Object attachment failure and then let
      # the real production pid-tree fallback run: they assert that a real child
      # and its real descendants disappeared, that nothing outside that tree was
      # touched, and that a failed root termination stays alertable. They get
      # their own bounded step so the proof is a named gate rather than a line
      # buried in the full run.
      - name: Windows Job attachment failure regressions
        timeout-minutes: 15
        working-directory: apps/sync/src-tauri
        run: cargo test --target x86_64-pc-windows-msvc --bins commands::process::windows_job_attachment_failure_tests -- --nocapture

      # Drives a real cmd.exe shim + descendant through the production registry
      # and job-object path, then reads the whole-tree Job Object accounting
      # (HQ-DESKTOP-4X). It proves the job query sees the Node-runner-class
      # descendant the shim's own working set hides (>= 2 processes) and that a
      # deregistered handle degrades to None rather than touching a closed
      # handle. Its own bounded gate so the real-binary proof is a named check.
      - name: Windows Job accounting attribution regression
        timeout-minutes: 15
        working-directory: apps/sync/src-tauri
        run: cargo test --target x86_64-pc-windows-msvc --bins commands::process::windows_job_attachment_failure_tests::watcher_job_accounting_reads_the_live_tree_and_is_generation_scoped -- --nocapture

      # The two historically flaky process-tree contracts run twice as
      # independent fresh test processes. Keeping each native invocation as a
      # direct `run: cargo …` step is intentional: the desktop E2E contract
      # verifies that native Windows gates fail fast rather than letting a
      # shell loop or later test mask a nonzero cargo exit.
      - name: Windows stale process fixture regression (repeat 1)
        timeout-minutes: 15
        working-directory: apps/sync/src-tauri
        run: cargo test --target x86_64-pc-windows-msvc --bins commands::process::windows_spawn_tests::stale_spawn_job_contains_descendant_before_ownership_check -- --nocapture

      - name: Windows job-accounting fixture regression (repeat 1)
        timeout-minutes: 15
        working-directory: apps/sync/src-tauri
        run: cargo test --target x86_64-pc-windows-msvc --bins commands::process::windows_job_attachment_failure_tests::watcher_job_accounting_reads_the_live_tree_and_is_generation_scoped -- --nocapture

      - name: Windows stale process fixture regression (repeat 2)
        timeout-minutes: 15
        working-directory: apps/sync/src-tauri
        run: cargo test --target x86_64-pc-windows-msvc --bins commands::process::windows_spawn_tests::stale_spawn_job_contains_descendant_before_ownership_check -- --nocapture

      - name: Windows job-accounting fixture regression (repeat 2)
        timeout-minutes: 15
        working-directory: apps/sync/src-tauri
        run: cargo test --target x86_64-pc-windows-msvc --bins commands::process::windows_job_attachment_failure_tests::watcher_job_accounting_reads_the_live_tree_and_is_generation_scoped -- --nocapture

      # The capture wiring: the new watcher_fault_* tags + runner_stderr_line_count
      # ride the watcher exit capture, additive to the untouched classifier
      # channels and fingerprint. Compiled and run on the msvc target (cargo check
      # never builds #[cfg(test)] code, so without this the wiring ships unrun).
      - name: Windows watcher fault capture tests
        timeout-minutes: 15
        working-directory: apps/sync/src-tauri
        run: cargo test --target x86_64-pc-windows-msvc --bins watcher_capture_reports -- --nocapture

      # HQ-DESKTOP-4X (r2). The deferral wiring, compiled and run on the msvc
      # target (cargo check never builds #[cfg(test)] code): a Windows fault exit
      # HOLDS its capture off the terminal exit callback with the honest `deferred`
      # provenance + the job-image tree observation, the pending registry drains
      # take-once so a teardown flush and a completing worker never double-send, and
      # the finalize patches ONLY the watcher_fault_* fields (grouping unchanged).
      - name: Windows watcher fault deferral wiring tests
        timeout-minutes: 15
        working-directory: apps/sync/src-tauri
        run: cargo test --target x86_64-pc-windows-msvc --bins watcher_fault_deferred -- --nocapture

      # HQ-DESKTOP-4X (r2) base-red / candidate-pass, proved deterministically on
      # the Windows runner in Node (scripted, no tauri-driver): the pre-fix policy
      # reproduces the observed 0.10.105 `no_record`/`unavailable` envelope verbatim
      # and cannot distinguish zero-records from a late publication; the post-fix
      # policy resolves the SAME late-published record to `pid_matched`/`node_exe`
      # and, when WER never publishes, renders the distinct `deadline_expired` token
      # plus the named job-image culprit candidate. Also source-contracts the
      # deferral seams so deleting any one fails here, not only in the Rust suite.
      # LIVE is deliberately unset so this runs the scripted (source-contract) set.
      - name: Watcher fault deferred-attribution both-directions proof
        timeout-minutes: 10
        working-directory: apps/sync
        run: pnpm vitest run --config e2e/desktop-alt/vitest.config.ts e2e/desktop-alt/watcher-fault-deferred-attribution.spec.ts

      # HQ-DESKTOP-4X artifact E2E: run the REAL wevtapi reader against the REAL
      # Windows Application log (content-safe + bounded, panic-free) and reproduce
      # a genuine abort through the production cmd.exe batch-shim shape. WER's async
      # crash capture is not guaranteed on a headless CI host, so this proves the
      # reader's determinism and content-safety against real OS output; a captured
      # node.exe 0xC0000409 is surfaced in the log as the strong signal.
      - name: Windows watcher fault provenance artifact E2E
        timeout-minutes: 15
        working-directory: apps/sync/src-tauri
        run: cargo test --target x86_64-pc-windows-msvc --bins commands::process::watcher_fault_e2e_tests -- --nocapture --include-ignored

      # HQ-DESKTOP-4N (r2) artifact E2E: run the pull-based teardown probe against
      # the REAL OS on the runner. `GetSystemMetrics(SM_SHUTTINGDOWN)` must read 0
      # (the runner is not shutting down) and a real bounded EvtQuery against the
      # System channel must open unelevated and return a definite reading, so the
      # combined verdict is TeardownAbsent and NEVER TeardownConfirmed — the probe
      # reads OS state, never fabricates a teardown, and closes the r1 artifact gap
      # that a signed-out runner (which owns no watcher child) could not exercise.
      - name: Windows teardown probe artifact E2E
        timeout-minutes: 15
        working-directory: apps/sync/src-tauri
        run: cargo test --target x86_64-pc-windows-msvc --bins commands::windows_teardown_probe::tests -- --nocapture

      # HQ-DESKTOP-5N/5P artifact E2E: drive the REAL atomic_replace_dir against a
      # REAL open handle. A file inside toolchain\node opened WITHOUT delete-share
      # makes the backup rename hit a genuine ERROR_ACCESS_DENIED (os error 5) —
      # the exact production fault. The candidate rides out a handle released
      # inside the retry budget, and when the handle is held the whole budget it
      # fails terminally WITH the phase/os-code/attempts attribution and cleans up
      # the staged tree rather than stranding it. #[ignore]-marked so the general
      # `cargo test --bins` run skips them; --test-threads=1 keeps the backoff env
      # seam these two share deterministic. Its own bounded gate, mirroring the
      # watcher-fault and teardown-probe real-OS E2E steps above.
      - name: Windows toolchain swap resilience artifact E2E
        timeout-minutes: 15
        working-directory: apps/sync/src-tauri
        run: cargo test --target x86_64-pc-windows-msvc --bins commands::install_deps::toolchain_swap_e2e_tests -- --nocapture --include-ignored --test-threads=1

      - name: Provision telemetry envelope tests
        working-directory: apps/sync/src-tauri
        run: cargo test --target x86_64-pc-windows-msvc --bins commands::run_cli_provision::tests

      # The Connect self-repair policy decides whether HQ downloads a Node
      # runtime. Its bound (one repair, one retry) is what stops a machine that
      # cannot install Node from looping on the download, so it is verified on
      # every target the app ships to.
      - name: Connect managed-Node self-repair tests
        working-directory: apps/sync/src-tauri
        run: cargo test --target x86_64-pc-windows-msvc --bins commands::workspaces::node_self_repair_tests

  # The two feature-flagged builds plus everything that drives a running app.
  # `sync-cancel-probe` and `e2e-automation` each rebuild the dependency graph,
  # and the launchable tauri build is a third; keeping all three on one runner
  # confines that churn instead of interleaving it with the default-feature
  # suite in windows-check-app.
  windows-check-live:
    needs: changes
    if: ${{ needs.changes.outputs.windows == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    name: Windows live app (e2e automation)
    runs-on: windows-latest
    # The longest of the three: ~11.5 min, dominated by three compiles.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/sync
    env:
      RUST_BACKTRACE: 1
      HQ_SYNC_SENTRY_DSN: ""

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Version comes from the root package.json "packageManager" field;
      # passing an explicit version here too is rejected as a conflict.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/sync/pnpm-lock.yaml

      - name: Install Rust (stable, x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      # rust-cache prunes to the registry plus dependency artifacts and covers
      # BOTH workspaces. shared-key is shared with cache-warm.yml on main so
      # new PRs restore from main instead of starting cold, and so PRs with an
      # exact hit do not each save their own copy.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/sync/src-tauri
          shared-key: windows-check-debug
          # This job is red ~15% of the time and the compile step that fills
          # the cache runs BEFORE the tests that fail. rust-cache defaults to
          # cache-on-failure:false, so those runs discard valid dependency
          # artifacts and the next run starts cold again.
          cache-on-failure: true
          # Reader. windows-check-app owns the write for this key; see the note
          # there. The feature-flagged builds here produce artifacts the other
          # jobs cannot reuse anyway, so saving them would evict shared ones.
          save-if: false

      - name: Install JS deps
        run: pnpm install --no-frozen-lockfile

      - name: Install Recall sidecar deps (build.rs resource)
        run: pnpm run sidecar:install

      - name: Build Svelte bundle (satisfies tauri frontendDist)
        run: pnpm run build

      # The base half is deliberately a red proof: it materializes this PR's
      # merge-base in a CI-local worktree and requires the legacy manual-sync
      # decision seam to report capture for code 1/no signal.
      - name: Base sync cancellation red proof
        timeout-minutes: 12
        working-directory: .
        run: node scripts/sync-cancel-base-probe.mjs

      # Runs a feature-gated path in the real menubar binary. The probe starts
      # a fixture child through the production registry, performs a generation-
      # aware Windows cancellation, and must observe the actual code-1 exit as
      # an effective timeout cancellation that suppresses capture.
      - name: Candidate sync cancellation artifact probe
        timeout-minutes: 15
        working-directory: apps/sync/src-tauri
        shell: pwsh
        run: |
          cargo build --target x86_64-pc-windows-msvc --features sync-cancel-probe
          $raw = & .\target\x86_64-pc-windows-msvc\debug\hq-sync-menubar.exe --sync-cancel-probe | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) { throw "sync-cancel probe failed with exit code $LASTEXITCODE" }
          $probe = $raw | ConvertFrom-Json
          if ($probe.exit_code -ne 1 -or $probe.cause -ne "timeout-watchdog" -or -not $probe.terminated -or $probe.decision -ne "suppress") {
            throw "unexpected sync-cancel probe result: $raw"
          }

      # Both sides of the `e2e-automation` gate are covered: the default run
      # above proves a shipped build cannot read
      # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS at all, and this run proves the CI
      # build still forwards it. Testing one configuration would leave the
      # other free to rot.
      - name: Windows app tests (e2e automation)
        working-directory: apps/sync/src-tauri
        run: cargo test --target x86_64-pc-windows-msvc --bins --features e2e-automation

      - name: Install Tauri WebDriver bridge
        run: cargo install tauri-driver --locked

      # The runner's preinstalled Edge WebDriver tracks the Edge browser, not
      # the WebView2 runtime the app embeds; when they drift by a major version
      # session creation fails ("only supports Microsoft Edge version N").
      # Install a driver matched to the runtime and shadow the preinstalled one.
      - name: Install msedgedriver matching the WebView2 runtime
        shell: pwsh
        run: scripts/ensure-msedgedriver.ps1

      # `--features e2e-automation` compiles in the WebView2 automation bridge
      # (src-tauri/src/util/webview2_automation.rs) that forwards msedgedriver's
      # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS into the app's webviews. It is off
      # in every shipped build — honouring that user-writable variable in a
      # release would let any local process turn the next launch into a CDP
      # listener reaching the Tauri command surface — so the binary driven below
      # differs from the one users install by exactly that gate.
      - name: Build launchable Windows app
        run: pnpm tauri build --debug --no-bundle --target x86_64-pc-windows-msvc --config src-tauri/tauri.windows.conf.json --features e2e-automation

      # HQ-DESKTOP-44. The only artifact-level proof that a Windows session end
      # no longer aborts the app: it launches the real binary and sends it
      # WM_QUERYENDSESSION then WM_ENDSESSION(TRUE) followed by an ordinary
      # posted message — the exact sequence that latches tao's event-loop runner
      # into `Destroyed` and then dispatches into it. A real logoff is not used;
      # it would take the runner down with it and prove less.
      #
      # Runs BEFORE the pre-auth smoke test on purpose: `tauri_plugin_single_instance`
      # folds a second launch into an already-running process, so these two must
      # never have an app up at the same time. Not conditional and never
      # continue-on-error — this job builds the binary, so the spec can always
      # run, and a skip would read as a pass.
      - name: Live Windows session-end proof
        env:
          HQ_SYNC_DESKTOP_ALT_LIVE: "1"
          HQ_SYNC_WINDOWS_SESSION_END_LIVE: "1"
          HQ_SYNC_DESKTOP_ALT_APP: ${{ github.workspace }}\apps\sync\src-tauri\target\x86_64-pc-windows-msvc\debug\hq-sync-menubar.exe
        run: pnpm vitest run --config e2e/desktop-alt/vitest.config.ts e2e/desktop-alt/windows-session-end.spec.ts

      # Defence in depth for the single-instance constraint above: if the
      # session-end spec failed mid-run it may have left the app up, which would
      # silently fold the next launch into it.
      - name: Stop any stray app instance
        if: always()
        shell: pwsh
        run: Get-Process hq-sync-menubar -ErrorAction SilentlyContinue | Stop-Process -Force

      # Signed-out by design: a GitHub runner has no Cognito session, and the
      # honest alternatives (a fabricated token, a CI login secret, or loosening
      # the gate) would each destroy the thing under test. The spec asserts what
      # a signed-out machine really reaches — the app boots, the popover paints,
      # and the desktop-alt gate refuses. The signed-in surfaces stay covered by
      # the scripted `Desktop-alt E2E` job (smoke-pages.spec.ts).
      - name: Live Windows pre-auth smoke test
        env:
          HQ_SYNC_DESKTOP_ALT_LIVE: "1"
          HQ_SYNC_DESKTOP_ALT_APP: ${{ github.workspace }}\apps\sync\src-tauri\target\x86_64-pc-windows-msvc\debug\hq-sync-menubar.exe
          HQ_SYNC_DESKTOP_ALT_DRIVER_LOG_DIR: ${{ runner.temp }}\desktop-alt-driver-logs
        run: pnpm vitest run --config e2e/desktop-alt/vitest.config.ts e2e/desktop-alt/live-preauth.spec.ts

      # always(), not failure(): the captured msedgewebview2.exe command line is
      # the evidence that the WebView2 automation switches landed, and a green
      # run is exactly when that evidence is worth keeping.
      - name: Upload WebDriver diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-check-webdriver-logs
          if-no-files-found: warn
          path: ${{ runner.temp }}/desktop-alt-driver-logs/**

  # `cargo check (x86_64-pc-windows-msvc)` is a required status check in the
  # `main` ruleset. Splitting the work into three jobs would have retired that
  # context entirely, leaving every PR waiting forever on a check that no
  # longer reports -- and adding the three new jobs to the ruleset instead
  # would leave a window in which none of them blocked a merge.
  #
  # So the name stays, on a job that now only adjudicates. It is deliberately
  # on ubuntu-latest and runs for seconds.
  #
  # The `always()` is load-bearing for the same reason it is on
  # windows-installer-e2e: GitHub reports a required check that was SKIPPED as
  # satisfied, so a job skipped because its `needs` failed is indistinguishable
  # from one skipped by the path gate, and a red suite would merge green.
  # `needs.changes.outputs.windows == 'true'` is still ANDed in, so the
  # intended path-gate skip survives -- when `changes` itself fails its outputs
  # are empty, that term is false, and this job skips exactly as before.
  #
  # Follow-up worth doing: add the three real jobs to the ruleset and delete
  # this one. That needs a settings change, which is why it is not bundled here.
  windows-check:
    needs: [changes, windows-check-crates, windows-check-app, windows-check-live]
    if: ${{ always() && needs.changes.outputs.windows == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    name: cargo check (x86_64-pc-windows-msvc)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fail when a Windows check job did not succeed
        if: ${{ needs.windows-check-crates.result != 'success' || needs.windows-check-app.result != 'success' || needs.windows-check-live.result != 'success' }}
        run: |
          echo "windows-check-crates: ${{ needs.windows-check-crates.result }}"
          echo "windows-check-app:    ${{ needs.windows-check-app.result }}"
          echo "windows-check-live:   ${{ needs.windows-check-live.result }}"
          exit 1

  # The installer E2E used to be one job that built the bridge installers,
  # built the target updater, and then ran the upgrade test. Both builds are
  # mandatory -- windows-installer-e2e.ps1 asserts the upgraded binary has a
  # different SHA256 AND a ProductVersion matching the target, so neither can be
  # replaced by reinstalling the same artifact -- but they are independent of
  # each other, and running them back to back put ~22 minutes of compile on the
  # critical path of a required check.
  #
  # They now run as two parallel build jobs feeding a thin E2E job. Critical
  # path becomes the longer build plus the test, not the sum of both builds.
  #
  # Deliberately NOT a caching change: cargo fingerprints workspace crates by
  # source mtime, and actions/checkout does not preserve mtimes, so a restored
  # workspace artifact is always stale and recompiles anyway. This split saves
  # wall clock without depending on any cache behaviour.
  #
  # The honest cost: on a cold cache both build jobs compile the dependency
  # graph, where the single job compiled it once. That is CPU, not wall clock,
  # and cache-warm.yml keeps `windows-installer-release` populated from main so
  # the cold path is the exception.
  build-bridge-installers:
    needs: changes
    if: ${{ needs.changes.outputs.windows == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    name: Build bridge installers (x64 MSI + NSIS)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/sync
    outputs:
      base: ${{ steps.versions.outputs.base }}
      bridge: ${{ steps.versions.outputs.bridge }}
      target: ${{ steps.versions.outputs.target }}
    env:
      RUST_BACKTRACE: 1
      HQ_SYNC_SENTRY_DSN: ""
      RECALL_SIDECAR_TARGET: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/sync/pnpm-lock.yaml

      - name: Install Rust (stable, x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Disjoint from the check job's shared-key: this job builds the release
      # profile and that one builds debug. shared-key is shared with
      # cache-warm.yml on main so new PRs restore from main instead of starting
      # cold, and so PRs with an exact hit do not each save their own copy.
      #
      # This is the only writer of that key. The sibling build job and the E2E
      # job compute the identical key, so letting them save too would just race
      # for the same entry and add nothing.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/sync/src-tauri
          shared-key: windows-installer-release
          # This job is red ~15% of the time and the compile step that fills
          # the cache runs BEFORE the tests that fail. rust-cache defaults to
          # cache-on-failure:false, so those runs discard valid dependency
          # artifacts and the next run starts cold again.
          cache-on-failure: true

      # Written AFTER rust-cache on purpose. The action hashes
      # `**/.cargo/config.toml` into its key, so writing this earlier forks a
      # second multi-GB cache lane out of the 10 GB the whole repository
      # shares. Writing it later is sound only because of what it overrides --
      # the rationale and the invariant are in the file itself.
      - name: Apply the CI fixture cargo profile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/.cargo | Out-Null
          Copy-Item -LiteralPath src-tauri/ci/fixture-profile.toml -Destination src-tauri/.cargo/config.toml -Force
          Get-Content src-tauri/.cargo/config.toml

      - name: Install JS deps
        run: pnpm install --no-frozen-lockfile

      # Install this PR at one synthetic patch, then build the same PR at the
      # next patch. The running parent and copied helper therefore contain the
      # same updater implementation, exactly as they do in production. The
      # sibling build job derives the same numbers from the same script.
      - name: Derive synthetic bridge and target versions
        id: versions
        shell: pwsh
        run: |
          $versions = node ../../scripts/windows-e2e-versions.mjs
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to derive the synthetic installer versions"
          }
          $versions | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host $versions

      - name: Stamp the bridge version
        shell: pwsh
        run: |
          pnpm -C ../.. version:app --set-version "${{ steps.versions.outputs.bridge }}"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to stamp bridge version ${{ steps.versions.outputs.bridge }}"
          }

      - name: Install Recall sidecar deps
        run: pnpm run sidecar:install

      # Built here rather than in the E2E job so the E2E job needs no Rust
      # toolchain and no rust-cache restore at all. rust-cache caches
      # ~/.cargo/bin, and cache-warm.yml installs it under the same key on main,
      # so this is a no-op lookup on a warm runner.
      - name: Install Tauri WebDriver bridge
        run: cargo install tauri-driver --locked

      # Same flag as the windows-check job: `e2e-automation` is what lets
      # msedgedriver attach, and it is never on in a shipped build. The honest
      # consequence is that this job packages an installer whose binary is NOT
      # byte-identical to the released one -- it differs by that one feature.
      # `cfg!(debug_assertions)` could not have been the gate instead: this is a
      # release build.
      - name: Generate Windows MSI version overlay
        shell: pwsh
        run: |
          $appVersion = node -p "require('./package.json').version"
          $configPath = Join-Path $env:RUNNER_TEMP "tauri.windows.msi-version.conf.json"
          node ../../scripts/windows-msi-version.mjs --version $appVersion --output $configPath
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to generate Windows MSI version overlay"
          }
          "TAURI_MSI_VERSION_CONFIG=$configPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build bridge MSI and NSIS installers
        run: >-
          pnpm tauri build
          --target x86_64-pc-windows-msvc
          --bundles msi nsis
          --config src-tauri/tauri.windows.conf.json
          --config src-tauri/tauri.windows.release.conf.json
          --config src-tauri/tauri.windows.ci.conf.json
          --config $env:TAURI_MSI_VERSION_CONFIG
          --features e2e-automation

      - name: Install Sentry CLI
        shell: pwsh
        run: npm install --global @sentry/cli@3.6.2

      # Exercise the release-profile symbol contract on every PR that changes
      # the release workflow. The e2e feature changes the binary's debug id,
      # but the executable and its PDB must still carry the same id.
      - name: Verify installer debug file contract
        shell: pwsh
        run: |
          $releaseDir = "src-tauri\target\x86_64-pc-windows-msvc\release"
          $exe = Join-Path $releaseDir "hq-sync-menubar.exe"
          $pdb = Join-Path $releaseDir "hq_sync_menubar.pdb"
          if (-not (Test-Path $exe)) {
            throw "Required installer executable is missing: $exe"
          }
          if (-not (Test-Path $pdb)) {
            throw "Required installer PDB is missing: $pdb"
          }
          $exeMetadata = (& sentry-cli difutil check --json $exe | ConvertFrom-Json)
          $pdbMetadata = (& sentry-cli difutil check --json $pdb | ConvertFrom-Json)
          $exeDebugId = @($exeMetadata.variants | ForEach-Object { $_.debug_id } | Where-Object { $_ } | Sort-Object -Unique) -join ","
          $pdbDebugId = @($pdbMetadata.variants | ForEach-Object { $_.debug_id } | Where-Object { $_ } | Sort-Object -Unique) -join ","
          if (-not $exeDebugId -or -not $pdbDebugId -or $exeDebugId -ne $pdbDebugId) {
            throw "Installer executable and PDB debug ids differ: exe=$exeDebugId pdb=$pdbDebugId"
          }
          Write-Host "Installer executable/PDB debug id: $exeDebugId"

      - name: Verify prerelease MSI package
        shell: pwsh
        run: |
          $msi = Get-ChildItem "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\msi\*.msi" -File -ErrorAction SilentlyContinue
          if (-not $msi) {
            throw "Tauri did not produce the required prerelease MSI package"
          }
          $msi | ForEach-Object { Write-Host "Built MSI: $($_.Name)" }

      # if-no-files-found: error, so a missing installer fails the job that
      # built it instead of surfacing later as an unexplained E2E failure.
      # The MSI is verified above and never installed, so only NSIS travels.
      - name: Upload bridge NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-bridge
          if-no-files-found: error
          retention-days: 1
          path: apps/sync/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*_${{ steps.versions.outputs.bridge }}_x64-setup.exe

      - name: Upload Tauri WebDriver bridge
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-tauri-driver
          if-no-files-found: error
          retention-days: 1
          path: ~/.cargo/bin/tauri-driver.exe

  build-target-updater:
    needs: changes
    if: ${{ needs.changes.outputs.windows == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    name: Build target updater (x64 NSIS)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/sync
    env:
      RUST_BACKTRACE: 1
      HQ_SYNC_SENTRY_DSN: ""
      RECALL_SIDECAR_TARGET: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/sync/pnpm-lock.yaml

      - name: Install Rust (stable, x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Same key as the bridge build -- same profile, same lockfiles, same
      # RUST*/CARGO* env -- so this restores exactly what that job restores.
      # save-if:false because both jobs would otherwise race to write one entry.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/sync/src-tauri
          shared-key: windows-installer-release
          cache-on-failure: true
          save-if: false

      # Written AFTER rust-cache on purpose. The action hashes
      # `**/.cargo/config.toml` into its key, so writing this earlier forks a
      # second multi-GB cache lane out of the 10 GB the whole repository
      # shares. Writing it later is sound only because of what it overrides --
      # the rationale and the invariant are in the file itself.
      - name: Apply the CI fixture cargo profile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/.cargo | Out-Null
          Copy-Item -LiteralPath src-tauri/ci/fixture-profile.toml -Destination src-tauri/.cargo/config.toml -Force
          Get-Content src-tauri/.cargo/config.toml

      - name: Install JS deps
        run: pnpm install --no-frozen-lockfile

      - name: Derive synthetic bridge and target versions
        id: versions
        shell: pwsh
        run: |
          $versions = node ../../scripts/windows-e2e-versions.mjs
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to derive the synthetic installer versions"
          }
          $versions | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host $versions

      - name: Stamp the target version
        shell: pwsh
        run: |
          pnpm -C ../.. version:app --set-version "${{ steps.versions.outputs.target }}"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to stamp target version ${{ steps.versions.outputs.target }}"
          }

      - name: Install Recall sidecar deps
        run: pnpm run sidecar:install

      # NSIS only, and no MSI version overlay: the target build exists to be
      # handed to the running bridge's copied updater helper, and only the NSIS
      # package takes that path.
      - name: Build next synthetic NSIS updater
        run: >-
          pnpm tauri build
          --target x86_64-pc-windows-msvc
          --bundles nsis
          --config src-tauri/tauri.windows.conf.json
          --config src-tauri/tauri.windows.release.conf.json
          --config src-tauri/tauri.windows.ci.conf.json
          --features e2e-automation

      - name: Upload target NSIS updater
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-target
          if-no-files-found: error
          retention-days: 1
          path: apps/sync/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*_${{ steps.versions.outputs.target }}_x64-setup.exe

  # This job's NAME is a required status check on `main`. Renaming it orphans
  # the context and every PR sits unmergeable.
  #
  # `always()` in the `if:` is load-bearing and subtle. Without it, a failed
  # build job would leave this job "skipped" -- and GitHub reports a skipped
  # required check as satisfied, so a broken installer build would merge green.
  # With it, the job starts regardless and the first step fails loudly. The
  # `needs.changes.outputs.windows == 'true'` term still evaluates to false when
  # the gate does not apply (and when `changes` itself failed, since its outputs
  # are then empty), so the intended skip-reports-Success path is unchanged.
  windows-installer-e2e:
    needs: [changes, build-bridge-installers, build-target-updater]
    if: ${{ always() && needs.changes.outputs.windows == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    name: installer E2E (x64 MSI + NSIS)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/sync
    env:
      RUST_BACKTRACE: 1
      HQ_SYNC_SENTRY_DSN: ""
      BRIDGE_VERSION: ${{ needs.build-bridge-installers.outputs.bridge }}
      TARGET_VERSION: ${{ needs.build-bridge-installers.outputs.target }}

    steps:
      # First step on purpose: this is what converts "a build job failed" from a
      # green required check into a red one.
      - name: Fail when an installer build job did not succeed
        if: ${{ needs.build-bridge-installers.result != 'success' || needs.build-target-updater.result != 'success' }}
        shell: pwsh
        run: |
          Write-Host "bridge build: ${{ needs.build-bridge-installers.result }}"
          Write-Host "target build: ${{ needs.build-target-updater.result }}"
          throw "A Windows installer build job did not succeed; failing the required check rather than reporting it satisfied."

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/sync/pnpm-lock.yaml

      - name: Install JS deps
        run: pnpm install --no-frozen-lockfile

      - name: Download bridge NSIS installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer-bridge
          path: ${{ runner.temp }}/installers/bridge

      - name: Download target NSIS updater
        uses: actions/download-artifact@v4
        with:
          name: windows-installer-target
          path: ${{ runner.temp }}/installers/target

      # No Rust toolchain in this job: the bridge build already produced
      # tauri-driver.exe, and the live harness only needs it on PATH
      # (e2e/desktop-alt/live-driver.ts resolves it by name).
      - name: Download Tauri WebDriver bridge
        uses: actions/download-artifact@v4
        with:
          name: windows-installer-tauri-driver
          path: ${{ runner.temp }}/tauri-driver

      - name: Put the Tauri WebDriver bridge on PATH
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "tauri-driver"
          $exe = Join-Path $dir "tauri-driver.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "tauri-driver.exe was not restored from the bridge build job"
          }
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append

      # The runner's preinstalled Edge WebDriver tracks the Edge browser, not
      # the WebView2 runtime the app embeds; when they drift by a major version
      # session creation fails ("only supports Microsoft Edge version N").
      # Install a driver matched to the runtime and shadow the preinstalled one.
      - name: Install msedgedriver matching the WebView2 runtime
        shell: pwsh
        run: scripts/ensure-msedgedriver.ps1

      - name: Install PR bridge NSIS package
        id: install_bridge
        shell: pwsh
        run: |
          $bridgeDir = Join-Path $env:RUNNER_TEMP "installers\bridge"
          $installer = Get-ChildItem $bridgeDir -Filter "*_$($env:BRIDGE_VERSION)_x64-setup.exe" -File -ErrorAction Stop | Select-Object -First 1
          if (-not $installer) {
            throw "Bridge NSIS installer was not produced"
          }
          $installDir = Join-Path $env:RUNNER_TEMP "hq-installer-e2e"
          $app = & "scripts\windows-installer-e2e.ps1" -Action install -InstallerPath $installer.FullName -InstallDir $installDir

          "app=$app" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "installer=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Installed PR bridge application: $app"

      - name: Roll back NSIS-installed bridge after an installer failure
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "hq-installer-e2e"
          & "scripts\windows-installer-e2e.ps1" -Action rollback -TargetVersion "$env:TARGET_VERSION" -InstallDir $installDir

      - name: Upgrade running PR bridge through its copied helper
        id: upgrade
        shell: pwsh
        run: |
          $targetDir = Join-Path $env:RUNNER_TEMP "installers\target"
          $installer = Get-ChildItem $targetDir -Filter "*_$($env:TARGET_VERSION)_x64-setup.exe" -File -ErrorAction Stop | Select-Object -First 1
          if (-not $installer) {
            throw "Target NSIS installer was not produced"
          }
          $installDir = Join-Path $env:RUNNER_TEMP "hq-installer-e2e"
          $app = & "scripts\windows-installer-e2e.ps1" -Action upgrade -InstallerPath $installer.FullName -TargetVersion "$env:TARGET_VERSION" -InstallDir $installDir

          "app=$app" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Upgraded application: $app"

      - name: Roll back NSIS-installed target after an installer failure
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "hq-installer-e2e"
          & "scripts\windows-installer-e2e.ps1" -Action rollback -TargetVersion "$env:TARGET_VERSION" -InstallDir $installDir

      # Same pre-auth scope as the windows-check job, against the installed
      # production package rather than a debug build.
      - name: Live pre-auth smoke test of the installed application
        env:
          HQ_SYNC_DESKTOP_ALT_LIVE: "1"
          HQ_SYNC_DESKTOP_ALT_APP: ${{ steps.upgrade.outputs.app }}
          HQ_SYNC_DESKTOP_ALT_DRIVER_LOG_DIR: ${{ runner.temp }}\desktop-alt-driver-logs
        run: pnpm vitest run --config e2e/desktop-alt/vitest.config.ts e2e/desktop-alt/live-preauth.spec.ts

      - name: List installed files on failure
        if: failure()
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "hq-installer-e2e"
          if (Test-Path -LiteralPath $installDir) {
            Get-ChildItem -LiteralPath $installDir -Recurse | Select-Object FullName, Length, LastWriteTime | Format-Table -AutoSize
          }

      # Two steps, not one path list: upload-artifact derives a single root
      # directory from the paths it is given, and these two live on different
      # roots (the runner's home vs. RUNNER_TEMP). Listing both under one step
      # fails with "The rootDirectory ... is not a parent directory of the file".
      - name: Upload application logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-e2e-app-logs
          if-no-files-found: warn
          path: ~/.hq/logs/**

      - name: Upload WebDriver diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-e2e-webdriver-logs
          if-no-files-found: warn
          path: ${{ runner.temp }}/desktop-alt-driver-logs/**

      - name: Uninstall production package
        if: always()
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "hq-installer-e2e"
          & "scripts\windows-installer-e2e.ps1" -Action uninstall -InstallerPath "${{ steps.install_bridge.outputs.installer }}" -InstallDir $installDir
