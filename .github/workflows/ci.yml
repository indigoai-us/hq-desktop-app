name: CI

# Test + lint gate for the unified app, restoring the coverage the three source
# repos ran on every PR (hq-installer / hq-sync / hq-sync-win). Mirrors
# hq-sync's ci.yml (typecheck + lint + build + coverage on the frontend, Rust
# unit tests on macOS) and its desktop-alt-e2e.yml.
#
# Blocking gates:
#   - frontend: typecheck (svelte-check), lint (svelte-check --threshold error),
#     build, and vitest-with-coverage.
#   - rust-macos: Rust unit tests for the app crate only (macOS = the shipping
#     platform, and the only runner where the real-child SIGKILL regressions
#     mean anything).
#   - rust-linux: the two heavy shared crates (hq-desktop-core, hq-telemetry),
#     which need nothing but rustc and so run at 1x instead of the 10x macOS
#     rate. hq-platform stays on rust-macos -- see that job's comment.
# Also blocking:
#   - e2e-desktop-alt: the desktop-alt source-contract suite (mirrors hq-sync's
#     desktop-alt-e2e.yml). Windows compile stays in windows-check.yml.
#   - workspace-packages: the vitest suites owned by packages/{auth,core,platform}.
#     Nothing in this file ran them: apps/sync, apps/work and @hq/ui each have
#     their own explicit step, but these three had none and the root `pnpm test`
#     (turbo run test) is never invoked — so PR #687 landed a broken
#     @hq/platform test on fully green CI.
# Non-blocking (continue-on-error) informational steps, flipping to required
# after a dedicated cleanup pass:
#   - cargo fmt --check (rust-linux) + cargo clippy -D warnings (rust-macos;
#     the app carries ~110 pre-existing clippy warnings, incl. several
#     await-holding-lock sites).

# Trigger contract (pinned by scripts/ci-cost-contract.test.ts -- read that
# file's "PR checks run on every base" block before changing any of this):
#
#   - NO `branches:` filter on pull_request. A stacked PR opened against a
#     non-main base used to match nothing here, so CI never started and every
#     required context stayed ABSENT -- which GitHub renders as a permanently
#     blocked PR rather than as "no runs". A stacked PR's checks are still
#     meaningful, so they run on every base.
#   - `edited` is in `types:` because retargeting a PR's base fires ONLY
#     `edited`. Without it, moving a stacked PR onto main still started no run
#     and the only way to unstick the PR was to push a throwaway commit.
#     `edited` also fires on title/body edits, and those extra runs are
#     ACCEPTED rather than gated away. Skipping the jobs on a non-base edit
#     (`github.event.action != 'edited' || github.event.changes.base != null`)
#     looks cheaper but is unsound here: GitHub reports a job skipped by a
#     job-level `if:` as Success, so editing the title of a PR whose suite is
#     RED would overwrite every required context with green and let it merge.
#     A handful of redundant runs is the cheaper mistake.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The frontend gate used to be ONE job running twenty-odd steps back to back
  # on a single runner. Measured across runs 35050123787 / 35057647412 /
  # 35060749760 it took 10m03s, 7m58s and 5m47s -- the widest job in this file
  # and, once the Windows installer chain came down, the thing that would set
  # how long a PR waits.
  #
  # None of those steps consumed another's output. apps/sync, apps/work and the
  # repo-level contract tests are independent, and the browser suite starts its
  # own vite preview server (see playwright.config.ts `webServer`) rather than
  # reading the `pnpm build` output that happened to precede it. They were
  # serial only because they shared a runner.
  #
  # They now run as four parallel jobs, grouped by what each one has to install
  # and start rather than by what it is called:
  #
  #   frontend-contracts  repo-level contract tests + @hq/ui
  #   frontend-sync       apps/sync typecheck, lint, build, vitest + coverage
  #   frontend-browser    apps/sync Playwright (Chromium + WebKit)
  #   frontend-work       apps/work typecheck, lint, tests, both build targets
  #
  # The extra cost is three more runner prologues; pnpm install restores from
  # the setup-node cache in under five seconds on each, so that trade is a
  # wall-clock win. `Frontend (typecheck + lint + coverage)` below is the
  # aggregator that keeps the required status check reporting -- same pattern as
  # `cargo check (x86_64-pc-windows-msvc)` in windows-check.yml.

  frontend-contracts:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Frontend contracts (workflows + @hq/ui)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # pnpm version is read from the root package.json "packageManager" field;
      # passing an explicit version here is rejected as a conflict.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Release workflow contract tests
        run: pnpm test:scripts
      - name: Release announcement changelog tests
        run: node --test .github/scripts/release-changelog-bullets.test.mjs
      - name: App version lockstep
        run: pnpm version:check
      - name: UI package checks (attachment components)
        run: |
          pnpm --filter @hq/ui typecheck
          pnpm --filter @hq/ui test

  frontend-sync:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Frontend sync app (typecheck + lint + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # pnpm version is read from the root package.json "packageManager" field;
      # passing an explicit version here is rejected as a conflict.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Typecheck (svelte-check)
        working-directory: apps/sync
        run: pnpm typecheck
      - name: Lint (svelte-check --threshold error)
        working-directory: apps/sync
        run: pnpm lint
      - name: Build
        working-directory: apps/sync
        env:
          SENTRY_AUTH_TOKEN: ""
          VITE_SENTRY_DSN: ""
        run: pnpm build
      - name: Vitest + coverage
        working-directory: apps/sync
        run: pnpm coverage
      - name: Coverage summary
        if: always()
        working-directory: apps/sync
        run: |
          {
            echo "## Coverage"
            if [ -f coverage/coverage-summary.json ]; then
              node -e "const c=require('./coverage/coverage-summary.json').total; for (const k of ['lines','statements','functions','branches']) console.log('- '+k+': '+c[k].pct+'%')"
            else
              echo "_(no coverage/coverage-summary.json produced)_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Split out because of what it installs, not because of what it tests:
  # `playwright install --with-deps chromium webkit` cost 59s on run
  # 35060749760 to support a suite that ran in 19s. On its own runner that
  # download overlaps the other three jobs instead of blocking them.
  frontend-browser:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Frontend browser suite (Chromium + WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # pnpm version is read from the root package.json "packageManager" field;
      # passing an explicit version here is rejected as a conflict.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Install layout regression browsers
        working-directory: apps/sync
        run: pnpm exec playwright install --with-deps chromium webkit
      # No `pnpm build` first: playwright.config.ts starts its own vite preview
      # server, so this suite never reads the dist the old serial job produced.
      - name: Desktop scroll containment (Chromium + WebKit)
        working-directory: apps/sync
        run: pnpm test:e2e:browser

  frontend-work:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Frontend work app (typecheck + lint + builds)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # pnpm version is read from the root package.json "packageManager" field;
      # passing an explicit version here is rejected as a conflict.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Work app typecheck (svelte-check)
        working-directory: apps/work
        run: pnpm typecheck
      - name: Work app lint (svelte-check --threshold error)
        working-directory: apps/work
        run: pnpm lint
      - name: Work app tests
        working-directory: apps/work
        run: pnpm test
      - name: Work app build (desktop, adapter-static)
        working-directory: apps/work
        env:
          TAURI: "1"
        run: pnpm build
      - name: Clean overlapping Work app build outputs
        # The desktop and web targets share SvelteKit output directories.
        run: rm -rf apps/work/.svelte-kit/output apps/work/build
      - name: Work app build (web, adapter-vercel)
        working-directory: apps/work
        run: pnpm build

  # NAME IS LOAD-BEARING: "Frontend (typecheck + lint + coverage)" is a required
  # status check in the active `main` ruleset. It named a job that did the work;
  # it now names the job that reports the verdict. Renaming it, or dropping it
  # in favour of the four job names above, makes that context never report and
  # every PR sits unmergeable waiting on a check that no longer exists. Add the
  # new contexts to the ruleset FIRST if you ever want to retire this job.
  #
  # `always()` is load-bearing for the same reason it is in windows-check.yml:
  # GitHub reports a required check that was SKIPPED as satisfied, and a job
  # skipped because its `needs` failed is indistinguishable from one skipped by
  # a draft-PR guard. `always()` starts this job regardless so the guard step
  # can turn an upstream failure into a real red. The draft term is kept in the
  # same `if:` so a draft PR still skips the whole gate exactly as before.
  frontend:
    needs: [frontend-contracts, frontend-sync, frontend-browser, frontend-work]
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    name: Frontend (typecheck + lint + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # First step on purpose: this is what converts "a frontend job failed"
      # from a green required check into a red one. `!= 'success'` and not
      # `== 'failure'` so cancelled, timed out and skipped all count as red.
      - name: Fail when a frontend job did not succeed
        if: ${{ needs.frontend-contracts.result != 'success' || needs.frontend-sync.result != 'success' || needs.frontend-browser.result != 'success' || needs.frontend-work.result != 'success' }}
        run: |
          echo "contracts: ${{ needs.frontend-contracts.result }}"
          echo "sync:      ${{ needs.frontend-sync.result }}"
          echo "browser:   ${{ needs.frontend-browser.result }}"
          echo "work:      ${{ needs.frontend-work.result }}"
          echo "A frontend job did not succeed; failing the required check rather than reporting it satisfied." >&2
          exit 1

  workspace-packages:
    name: Workspace packages (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      # BLOCKING. @hq/auth, @hq/core and @hq/platform are real workspace members
      # with their own `test` script (vitest run), and nothing in this workflow
      # ran them. Every sibling has an explicit step — apps/sync ("Vitest +
      # coverage"), apps/work ("Work app tests"), @hq/ui ("UI package checks") —
      # but these three had none, and the root `pnpm test` (turbo run test) that
      # would have covered the whole workspace is never invoked. That is how PR
      # #687 landed a failing @hq/platform test on fully green CI.
      #
      # Keep this filter in sync when a package is added under packages/: a new
      # member is silently untested until it is listed here or gets its own step.
      # `--force` bypasses the turbo cache for these test tasks so a cache replay
      # can never re-report a stale PASS for changed sources.
      - name: Package tests (@hq/auth, @hq/core, @hq/platform)
        run: >-
          pnpm turbo run test --force
          --filter=@hq/auth
          --filter=@hq/core
          --filter=@hq/platform

  rust-macos:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # NAME IS LOAD-BEARING: "Rust tests (macOS)" is a required status check in
    # the active `main` ruleset. Renaming this job makes that check never
    # report, which blocks every PR from merging. Change the ruleset first.
    name: Rust tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: 1
      HQ_SYNC_SENTRY_DSN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      # build.rs validates the bundled `resources` paths in tauri.conf.json —
      # including the Recall sidecar's node_modules, which only exists after the
      # sidecar install. Without it `cargo test` fails the build script.
      - name: Install Recall sidecar deps (bundled resource)
        working-directory: apps/sync
        run: pnpm run sidecar:install
      # tauri's `generate_context!` embeds the frontend dist at compile time, so
      # the Svelte bundle must exist before the app crate will build for tests.
      - name: Build Svelte bundle (satisfies tauri frontendDist)
        working-directory: apps/sync
        env:
          SENTRY_AUTH_TOKEN: ""
          VITE_SENTRY_DSN: ""
        run: pnpm build
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/sync/src-tauri
          cache-on-failure: true
      - name: App crate tests (hq-sync-menubar)
        timeout-minutes: 20
        working-directory: apps/sync/src-tauri
        run: cargo test --locked
      # There is deliberately NO separate step re-running
      # `commands::process::cross_generation_escalation_tests` here. Measured on
      # run 35060749760 that step cost 86s on a 10x runner: 1m22s of it was cargo
      # rebuilding the test binary, and it then ran ONE test --
      # stale_escalation_cannot_reach_a_replacement_generation -- in 2.55s. The
      # `cargo test --locked` step above had already run that same test 90
      # seconds earlier, inside its 1239-test pool ("1 passed; 1238 filtered
      # out" is the whole step). It bought no coverage on this runner.
      #
      # The rest of that module is cfg(windows) and #[ignore]d, and its doc
      # comment says those cases "run only in their own isolated windows-check
      # step via --include-ignored". They do not: windows-check.yml passes
      # --include-ignored for watcher_fault_e2e_tests and
      # toolchain_swap_e2e_tests, and never for this module. That gap is real
      # and is NOT closed here -- turning on three never-executed real-process
      # Windows E2E cases belongs in its own change that can land them green.
      # Real-process artifact E2E for the bounded cli-install lock wait
      # (HQ-DESKTOP-6J): a genuine second OS process holds the real cli-update
      # lock under a temp HQ_LOCK_DIR; each case loops >= 20 sequential iterations
      # so one green run is repeated-run evidence. Timeout-bounded, mirroring the
      # escalation step above; the env opt-in gives a real (bounded) backoff window.
      - name: cli-install lock wait regressions (real children)
        timeout-minutes: 10
        working-directory: apps/sync/src-tauri
        run: HQ_CLI_LOCK_TEST_BACKOFF_MS=200 cargo test --locked commands::install_deps::cli_install_lock_e2e_tests -- --nocapture --include-ignored --test-threads=1
      # hq-platform's tests and the full-workspace lockfile check live here
      # rather than on rust-linux: both need window-vibrancy, whose Linux
      # backend links GTK3. See the rust-linux job comment.
      - name: Platform crate tests (hq-platform)
        run: cargo test -p hq-platform --locked
      - name: Root workspace lockfile check
        run: cargo check --workspace --locked
      - name: App workspace lockfile check
        working-directory: apps/sync/src-tauri
        run: cargo check --locked
      # ── Non-blocking style gates (flip to required after the cleanup pass) ──
      # `push` only. This is `continue-on-error`, so at PR time it gated
      # nothing: it could not fail the check, and nobody reads a green job's
      # annotations. What it did do was compile the whole app crate a third
      # time, in a third profile, on a 10x runner -- 38s on run 35060749760,
      # 47s on run 35050123787, all of it on the critical path of a REQUIRED
      # status check. Running it on main keeps the signal and the warning
      # count trend while taking it off every PR. Delete this `if:` at the
      # same time as the `continue-on-error:` when the cleanup pass promotes
      # clippy to a real gate.
      - name: cargo clippy (non-blocking)
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        working-directory: apps/sync/src-tauri
        run: cargo clippy --all-targets -- -D warnings

  # macOS runners bill at 10x a Linux minute, so only work that genuinely needs
  # the shipping platform belongs in rust-macos. The root workspace (crates/*)
  # is not that work: hq-desktop-core declares its Unix dependencies under
  # cfg(any(target_os = "macos", target_os = "linux")) and hq-telemetry is pure
  # Rust. hq-platform has no Linux implementation at all -- every seam in it is
  # cfg(macos)/cfg(windows) -- but it still has to link its window-vibrancy
  # dependency, which needs GTK3 headers on Linux.
  rust-linux:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Rust tests (shared crates, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .
          cache-on-failure: true
      # hq-platform is deliberately absent: its window-vibrancy dependency links
      # GTK3 on Linux, and installing those headers cost 2.5 of this job's 4.5
      # minutes and failed 2 of 3 runs on Ubuntu mirror outages (runs
      # 32299864862, 32302036015) -- a network dependency worth more than the
      # crate it serves. hq-desktop-core and hq-telemetry are the heavy two and
      # need nothing beyond rustc; hq-platform stays on rust-macos.
      - name: Shared crate tests (hq-desktop-core, hq-telemetry)
        run: cargo test -p hq-desktop-core -p hq-telemetry --locked
      # rustfmt only parses, so it needs neither the Tauri toolchain nor a macOS
      # runner. Kept non-blocking exactly as it was on rust-macos -- this change
      # moves the check, it does not promote it to a required gate.
      - name: cargo fmt --check, root workspace (non-blocking)
        continue-on-error: true
        run: cargo fmt --check
      - name: cargo fmt --check, app crate (non-blocking)
        continue-on-error: true
        working-directory: apps/sync/src-tauri
        run: cargo fmt --check

  # NAME IS LOAD-BEARING once added to the main ruleset required checks.
  # Cheap mocked mounts of HqWorkDesktopShell for the four release-gate
  # personas (non-Indigo empty inbox, personal-only, multi-company, Indigo).
  # This is the PR-time layer that would have caught v0.10.178: every prior
  # check ran as an Indigo member with conversations.
  shell-boot-matrix:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Shell boot matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Persona shell boot (vitest)
        working-directory: apps/sync
        run: pnpm exec vitest run __tests__/stories/shell-boot-persona-matrix.test.ts
      - name: Persona shell boot (desktop-alt e2e)
        working-directory: apps/sync
        run: pnpm exec vitest run --config e2e/desktop-alt/vitest.config.ts e2e/desktop-alt/shell-boot-persona-matrix.spec.ts

  e2e-desktop-alt:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Desktop-alt E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      # BLOCKING: the desktop-alt source-contract suite (42 files / 221 tests) is
      # green. The parity items it once flagged are resolved — the recall
      # recording-tracker.mjs is bundled on every platform (#91), and the
      # Files-mode lister (list_dir_entries + DirEntry), the project-status path
      # guard + atomic write, and the metadata-only SecretItem projection are all
      # implemented AND unit-tested in the hq-desktop-core library, with the
      # specs asserting that shared-crate location (the command binary can't own
      # those definitions — the library it depends on does).
      - name: Desktop-alt E2E
        working-directory: apps/sync
        run: pnpm test:e2e:desktop-alt
