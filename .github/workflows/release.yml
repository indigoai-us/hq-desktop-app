name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (vX.Y.Z, vX.Y.Z-beta.N, or vX.Y.Z-alpha.N)."
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Unverified / beta release mode. When "true" (the default), skip Apple
  # notarization and Azure Authenticode signing so testable builds ship before
  # the Developer ID cert + Azure federated credential are in place. The app is
  # ad-hoc signed (required for Apple Silicon to run) and the Tauri updater
  # signatures (minisign) are still produced, so auto-update keeps working —
  # only Gatekeeper/SmartScreen install-time trust is deferred. Flip to a fully
  # signed + notarized release by setting the repo variable RELEASE_UNVERIFIED
  # to "false" (Settings → Secrets and variables → Actions → Variables) — no
  # code change needed.
  UNVERIFIED_RELEASE: ${{ vars.RELEASE_UNVERIFIED || 'true' }}

jobs:
  validate:
    name: Validate release tag and version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.classify.outputs.tag }}
      version: ${{ steps.classify.outputs.version }}
      channel: ${{ steps.classify.outputs.channel }}
      prerelease: ${{ steps.classify.outputs.prerelease }}
      make_latest: ${{ steps.classify.outputs.make_latest }}
      msi_version: ${{ steps.msi-version.outputs.version }}

    steps:
      # Keep these strict shapes aligned with
      # crates/hq-desktop-core/src/release_channel.rs::parse_channel_from_tag.
      # In particular, raw `-beta`, `-rc.N`, and extra prerelease identifiers
      # are rejected so CI cannot publish a release the client will not route.
      - name: Validate tag format and classify channel
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            if [ -z "$TAG" ]; then
              echo "::error::workflow_dispatch requires an existing release tag."
              exit 1
            fi
          else
            if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
              echo "::error::Release pushes must run from a tag ref, got: ${GITHUB_REF_TYPE:-unknown}"
              exit 1
            fi
            TAG="$REF_NAME"
          fi

          if [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            CHANNEL="stable"
            PRERELEASE="false"
            MAKE_LATEST="true"
          elif [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta\.(0|[1-9][0-9]*)$ ]]; then
            CHANNEL="beta"
            PRERELEASE="true"
            MAKE_LATEST="false"
          elif [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-alpha\.(0|[1-9][0-9]*)$ ]]; then
            CHANNEL="alpha"
            PRERELEASE="true"
            MAKE_LATEST="false"
          else
            echo "::error::Tag must match vX.Y.Z, vX.Y.Z-beta.N, or vX.Y.Z-alpha.N; got: $TAG"
            exit 1
          fi

          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "channel=$CHANNEL"
            echo "prerelease=$PRERELEASE"
            echo "make_latest=$MAKE_LATEST"
          } >> "$GITHUB_OUTPUT"

          echo "Release tag $TAG classified as channel=$CHANNEL prerelease=$PRERELEASE make_latest=$MAKE_LATEST"

      - name: Checkout exact release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.classify.outputs.tag }}
          fetch-depth: 0

      # workflow_dispatch may intentionally retry a historical tag that
      # predates the current publication helpers. Keep immutable build inputs
      # at the tag root while loading the reviewed control plane from the exact
      # commit that defines this workflow run.
      - name: Checkout release control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-control
          sparse-checkout: |
            scripts/release-asset-contract.mjs
            scripts/release-stable-order.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Require release tag commit on main
        env:
          TAG: ${{ steps.classify.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          if ! git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor \
            "${TAG}^{commit}" refs/remotes/origin/main; then
            echo "::error::Release tag $TAG is not contained in origin/main. Merge the release commit before tagging."
            exit 1
          fi

      - name: Validate versions.toml and stamped app versions
        env:
          TAG: ${{ steps.classify.outputs.tag }}
          VERSION: ${{ steps.classify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/${TAG}" || {
            echo "::error::Release tag does not exist: $TAG"
            exit 1
          }

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const tag = process.env.TAG;
          const version = process.env.VERSION;
          const versionsToml = fs.readFileSync("versions.toml", "utf8");
          const versionsTomlMatch =
            versionsToml.match(/^\[product\][\s\S]*?^version\s*=\s*"([^"]+)"/m);
          if (!versionsTomlMatch) {
            console.error("::error file=versions.toml::Could not find [product] version");
            process.exit(1);
          }

          const packageVersion =
            JSON.parse(fs.readFileSync("apps/sync/package.json", "utf8")).version;
          const tauriVersion =
            JSON.parse(fs.readFileSync("apps/sync/src-tauri/tauri.conf.json", "utf8")).version;

          const cargoToml = fs.readFileSync("apps/sync/src-tauri/Cargo.toml", "utf8");
          const cargoTomlMatch =
            cargoToml.match(/^\[package\][\s\S]*?^version\s*=\s*"([^"]+)"/m);
          if (!cargoTomlMatch) {
            console.error("::error file=apps/sync/src-tauri/Cargo.toml::Could not find package version");
            process.exit(1);
          }

          const cargoLock = fs.readFileSync("apps/sync/src-tauri/Cargo.lock", "utf8");
          const cargoLockMatch =
            cargoLock.match(/^\[\[package\]\]\nname = "hq-sync-menubar"\nversion = "([^"]+)"/m);
          if (!cargoLockMatch) {
            console.error("::error file=apps/sync/src-tauri/Cargo.lock::Could not find hq-sync-menubar package entry");
            process.exit(1);
          }

          const checks = [
            ["versions.toml", versionsTomlMatch[1]],
            ["apps/sync/package.json", packageVersion],
            ["apps/sync/src-tauri/tauri.conf.json", tauriVersion],
            ["apps/sync/src-tauri/Cargo.toml", cargoTomlMatch[1]],
            ["apps/sync/src-tauri/Cargo.lock", cargoLockMatch[1]],
          ];
          const mismatches = checks.filter(([, actual]) => actual !== version);
          if (mismatches.length > 0) {
            for (const [file, actual] of mismatches) {
              console.error(`::error file=${file}::Release tag ${tag} expects version ${version}, found ${actual}`);
            }
            process.exit(1);
          }

          console.log(`Release ${tag} matches versions.toml and all four stamped app version files`);
          NODE

      - name: Validate Windows MSI ProductVersion
        id: msi-version
        env:
          APP_VERSION: ${{ steps.classify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          MSI_VERSION="$(node scripts/windows-msi-version.mjs --version "$APP_VERSION")"
          echo "version=$MSI_VERSION" >> "$GITHUB_OUTPUT"
          echo "App version $APP_VERSION maps to Windows MSI ProductVersion $MSI_VERSION"

      - name: Reject stable release rollback
        if: ${{ steps.classify.outputs.channel == 'stable' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_TAG: ${{ steps.classify.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          node .release-control/scripts/release-stable-order.mjs stable-order \
            --repository "$TARGET_REPOSITORY" \
            --tag "$TARGET_TAG"

  macos:
    name: Build macOS universal
    needs: validate
    runs-on: macos-14
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/sync

    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/sync/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Put rustup-managed cargo first on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Replace any cargo shim with rustup-managed cargo
        shell: bash
        run: |
          set -euo pipefail
          rustup_cargo="$HOME/.cargo/bin/cargo"
          if [ ! -x "$rustup_cargo" ]; then
            echo "::error::rustup-managed cargo not found at $rustup_cargo"
            exit 1
          fi

          echo "PATH=$PATH"
          echo "All cargo on PATH:"
          which -a cargo || true

          replaced=0
          while IFS= read -r c; do
            [ -n "$c" ] || continue
            if [ "$c" = "$rustup_cargo" ]; then
              continue
            fi
            target="$(readlink "$c" 2>/dev/null || true)"
            if [ "$target" = "$rustup_cargo" ]; then
              continue
            fi
            echo "Replace shim: $c (was -> '${target:-<regular file>}') -> $rustup_cargo"
            sudo rm -f "$c"
            sudo ln -sf "$rustup_cargo" "$c"
            replaced=$((replaced + 1))
          done < <(which -a cargo 2>/dev/null || true)

          if [ "$replaced" = 0 ]; then
            echo "No non-rustup cargo entries on PATH."
          fi

          which cargo
          cargo --version
          cargo metadata --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml >/dev/null

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/sync/src-tauri -> apps/sync/src-tauri/target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Recall sidecar dependencies
        run: pnpm run sidecar:install

      - name: Import Developer ID Application certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT_PATH="$RUNNER_TEMP/developer-id-application.p12"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/[",]//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build unsigned universal app and updater archive
        env:
          HQ_SYNC_SENTRY_DSN: ${{ secrets.HQ_SYNC_SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target universal-apple-darwin --config src-tauri/tauri.macos.conf.json

      - name: Install Sentry CLI
        shell: bash
        run: npm install --global @sentry/cli@3.6.2

      - name: Verify macOS debug file contract
        shell: bash
        run: |
          set -euo pipefail
          APP_BUNDLE="src-tauri/target/universal-apple-darwin/release/bundle/macos/HQ.app"
          APP_BINARY="$APP_BUNDLE/Contents/MacOS/hq-sync-menubar"
          DSYM_BUNDLE="${APP_BUNDLE}.dSYM"
          DSYM_BINARY="$DSYM_BUNDLE/Contents/Resources/DWARF/hq-sync-menubar"
          test -f "$APP_BINARY"

          # --- Diagnostics: what is actually in the bundle before we strip? ---
          echo "== macOS bundle diagnostics (pre-strip) =="
          du -sk "$APP_BUNDLE"  | awk '{print "  app bundle KB:", $1}'
          du -sk "$APP_BINARY"  | awk '{print "  app binary KB:", $1}'
          du -sk "$APP_BUNDLE/Contents/Resources" 2>/dev/null | awk '{print "  resources KB:", $1}' || true
          echo "  largest entries:"
          du -sk "$APP_BUNDLE"/Contents/* "$APP_BUNDLE"/Contents/Resources/* 2>/dev/null | sort -rn | head -15 || true
          echo "  Mach-O segments (app binary):"
          xcrun size -m "$APP_BINARY" 2>/dev/null | grep -iE 'Segment __|total ' | head -40 || true
          echo "  packed per-arch dSYMs:"
          ls -ld src-tauri/target/*/release/hq-sync-menubar.dSYM 2>/dev/null || echo "    (none found)"

          # --- Produce the sidecar dSYM BEFORE stripping the app binary ---
          # Preferred source: the packed per-arch dSYMs that split-debuginfo =
          # "packed" emits at link time. The universal app binary is a lipo of
          # both arch slices (two debug ids), so combine the matching per-arch
          # DWARF into one fat DWARF whose id set matches the app binary. If the
          # packed dSYMs are somehow absent, fall back to dsymutil on the
          # not-yet-stripped universal binary.
          declare -a DWARF_SLICES=()
          FIRST_PACKED_DSYM=""
          for ARCH in aarch64-apple-darwin x86_64-apple-darwin; do
            PACKED_DSYM="src-tauri/target/${ARCH}/release/hq-sync-menubar.dSYM"
            PACKED_DWARF="${PACKED_DSYM}/Contents/Resources/DWARF/hq-sync-menubar"
            if [ -f "$PACKED_DWARF" ]; then
              DWARF_SLICES+=("$PACKED_DWARF")
              [ -z "$FIRST_PACKED_DSYM" ] && FIRST_PACKED_DSYM="$PACKED_DSYM"
            else
              echo "::warning::No packed dSYM for ${ARCH} at ${PACKED_DSYM}"
            fi
          done
          rm -rf "$DSYM_BUNDLE"
          if [ "${#DWARF_SLICES[@]}" -gt 0 ]; then
            cp -R "$FIRST_PACKED_DSYM" "$DSYM_BUNDLE"
            lipo -create "${DWARF_SLICES[@]}" -output "$DSYM_BINARY"
          else
            echo "::warning::No packed per-arch dSYM found; falling back to dsymutil on the pre-strip universal binary"
            xcrun dsymutil "$APP_BINARY" -o "$DSYM_BUNDLE"
          fi
          test -f "$DSYM_BINARY"

          # --- Deterministically strip the shipped binary ---
          # cargo's strip ([profile.release] strip = "symbols") proved
          # insufficient on this universal build: it removed the symbol table
          # but left the embedded __DWARF, so the bundle intermittently blew the
          # budget. Strip explicitly here (debug info now lives in the sidecar
          # dSYM above). LC_UUID — the Sentry debug id — survives strip, so the
          # app binary and the sidecar still share the same id set.
          xcrun strip -S -x "$APP_BINARY"
          du -sk "$APP_BINARY" | awk '{print "  app binary KB (post-strip):", $1}'

          # --- Enforce the 15 MB budget on the stripped bundle ---
          BUNDLE_KB="$(du -sk "$APP_BUNDLE" | awk '{print $1}')"
          BUNDLE_BUDGET_KB=$((15 * 1024))
          if [ "$BUNDLE_KB" -ge "$BUNDLE_BUDGET_KB" ]; then
            echo "::error::macOS app bundle exceeds 15 MB budget: ${BUNDLE_KB} KB"
            exit 1
          fi
          echo "macOS app bundle size: ${BUNDLE_KB} KB (< ${BUNDLE_BUDGET_KB} KB)"

          APP_DEBUG_ID="$(sentry-cli difutil check --json "$APP_BINARY" | python3 -c 'import json,sys; data=json.load(sys.stdin); ids=sorted({variant.get("debug_id") for variant in data.get("variants", []) if variant.get("debug_id")}); assert ids; print(",".join(ids))')"
          DSYM_DEBUG_ID="$(sentry-cli difutil check --json "$DSYM_BINARY" | python3 -c 'import json,sys; data=json.load(sys.stdin); ids=sorted({variant.get("debug_id") for variant in data.get("variants", []) if variant.get("debug_id")}); assert ids; print(",".join(ids))')"
          test -n "$APP_DEBUG_ID"
          test "$APP_DEBUG_ID" = "$DSYM_DEBUG_ID"
          echo "macOS app/dSYM debug id: $APP_DEBUG_ID"

      - name: Upload macOS debug files to Sentry
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          DEBUG_DIR="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          APP_BINARY="$DEBUG_DIR/HQ.app/Contents/MacOS/hq-sync-menubar"
          DEBUG_ID="$(sentry-cli difutil check --json "$APP_BINARY" | python3 -c 'import json,sys; data=json.load(sys.stdin); ids=sorted({variant.get("debug_id") for variant in data.get("variants", []) if variant.get("debug_id")}); print(",".join(ids) or "unknown")')"
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            MESSAGE="SENTRY_AUTH_TOKEN is not configured; debug id $DEBUG_ID was not uploaded and no recoverable debug file was retained."
            echo "::warning::$MESSAGE"
            printf '%s\n' "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! sentry-cli debug-files upload --org indigo-d0 --project hq-desktop --no-sources --wait-for 60 "$DEBUG_DIR"; then
            MESSAGE="SENTRY_AUTH_TOKEN is invalid or upload failed; debug id $DEBUG_ID was not uploaded and no recoverable debug file was retained."
            echo "::warning::$MESSAGE"
            printf '%s\n' "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          export DEBUG_IDS="$DEBUG_ID"
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          endpoint = "https://sentry.io/api/0/projects/indigo-d0/hq-desktop/files/dsyms/"
          token = os.environ["SENTRY_AUTH_TOKEN"]
          debug_ids = [debug_id for debug_id in os.environ["DEBUG_IDS"].split(",") if debug_id]
          if not debug_ids:
              raise SystemExit("debug-file upload verification has no debug ids")

          for debug_id in debug_ids:
              url = f"{endpoint}?{urllib.parse.urlencode({'debug_id': debug_id})}"
              request = urllib.request.Request(
                  url,
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/json"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  records = json.load(response)
              if not any((record.get("debugId") or "").casefold() == debug_id.casefold() for record in records):
                  raise SystemExit(f"Sentry debug-file listing is missing uploaded debug id {debug_id}")
              print(f"Verified Sentry debug-file record for {debug_id}")
          PY

      - name: Fix Recall framework symlinks
        shell: bash
        run: bash scripts/fix-recall-framework-symlinks.sh "src-tauri/target/universal-apple-darwin/release/bundle/macos/HQ.app"

      - name: Sign app bundle
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/HQ.app"
          if [ "${UNVERIFIED_RELEASE}" = "true" ]; then
            echo "UNVERIFIED_RELEASE=true — ad-hoc signing (runnable on Apple Silicon; not notarized)."
            HARDENED_RUNTIME=0 TIMESTAMP=0 HQ_SIGN_ENTITLEMENTS="" \
              bash scripts/sign-bundle.sh "$APP" "-"
          else
            HARDENED_RUNTIME=1 TIMESTAMP=1 HQ_SIGN_ENTITLEMENTS="src-tauri/Entitlements.plist" \
              bash scripts/sign-bundle.sh "$APP" "$APPLE_SIGNING_IDENTITY"
          fi

      - name: Notarize and staple app bundle
        if: ${{ env.UNVERIFIED_RELEASE != 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/HQ.app"
          ZIP_PATH="$RUNNER_TEMP/HQ-notarize.zip"
          # notarytool needs a zip/dmg; staple the .app after the ticket is issued.
          /usr/bin/ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"
          SUBMIT_JSON="$(xcrun notarytool submit "$ZIP_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 1800 \
            --output-format json)"
          echo "$SUBMIT_JSON"
          SUB_ID="$(echo "$SUBMIT_JSON" | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')"
          STATUS="$(echo "$SUBMIT_JSON" | python3 -c 'import sys,json;print(json.load(sys.stdin)["status"])')"
          # On anything other than Accepted, dump Apple's per-file notary log
          # (the only place that names which binary was rejected) and fail.
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization status: $STATUS — fetching notary log for $SUB_ID"
            xcrun notarytool log "$SUB_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" || true
            exit 1
          fi
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

      - name: Regenerate updater archive and signature
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/HQ.app"
          ARTIFACT_DIR="src-tauri/target/release-artifacts"
          TAR_GZ="$ARTIFACT_DIR/HQ_${VERSION}_universal.app.tar.gz"

          mkdir -p "$ARTIFACT_DIR"
          rm -f "$TAR_GZ" "$TAR_GZ.sig"
          tar -C "$(dirname "$APP_PATH")" -czf "$TAR_GZ" "$(basename "$APP_PATH")"
          pnpm tauri signer sign "$TAR_GZ"
          test -f "$TAR_GZ.sig"

      - name: Create, sign, notarize, and staple DMG
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/HQ.app"
          ARTIFACT_DIR="src-tauri/target/release-artifacts"
          DMG_PATH="$ARTIFACT_DIR/HQ_${VERSION}_universal.dmg"

          mkdir -p "$ARTIFACT_DIR"

          bash scripts/create-dmg.sh "$APP_PATH" "$DMG_PATH"
          if [ "${UNVERIFIED_RELEASE}" = "true" ]; then
            echo "UNVERIFIED_RELEASE=true — ad-hoc signing DMG, skipping notarization."
            codesign --force --sign - "$DMG_PATH" || true
          else
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$DMG_PATH"
            xcrun notarytool submit "$DMG_PATH" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait \
              --timeout 1800
            xcrun stapler staple "$DMG_PATH"
            spctl -a -t open --context context:primary-signature -v "$DMG_PATH"
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hq-macos-universal
          if-no-files-found: error
          path: |
            apps/sync/src-tauri/target/release-artifacts/*.dmg
            apps/sync/src-tauri/target/release-artifacts/*.app.tar.gz
            apps/sync/src-tauri/target/release-artifacts/*.app.tar.gz.sig

  windows:
    name: Build Windows ${{ matrix.target }}
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    environment: release
    defaults:
      run:
        working-directory: apps/sync
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc

    env:
      RUST_BACKTRACE: 1
      HQ_SYNC_SENTRY_DSN: ${{ secrets.HQ_SYNC_SENTRY_DSN }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/sync/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/sync/src-tauri -> apps/sync/src-tauri/target"
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Recall sidecar dependencies
        run: pnpm run sidecar:install

      - name: Download native ARM64 Node runtime for Recall launcher
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $version = node -p "process.version"
          $archiveName = "node-$version-win-arm64.zip"
          $baseUrl = "https://nodejs.org/dist/$version"
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $checksums = Join-Path $env:RUNNER_TEMP "SHASUMS256.txt"
          $extract = Join-Path $env:RUNNER_TEMP "node-$version-win-arm64"

          Invoke-WebRequest "$baseUrl/$archiveName" -OutFile $archive
          Invoke-WebRequest "$baseUrl/SHASUMS256.txt" -OutFile $checksums
          $checksumLine = Get-Content $checksums | Where-Object { $_ -match "\s+$([regex]::Escape($archiveName))$" } | Select-Object -First 1
          if (-not $checksumLine) {
            throw "No Node checksum found for $archiveName"
          }
          $expected = ($checksumLine -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Node ARM64 checksum mismatch: expected $expected, got $actual"
          }

          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP -Force
          $nodeExe = Join-Path $extract "node.exe"
          if (-not (Test-Path $nodeExe)) {
            throw "ARM64 node.exe was not extracted at $nodeExe"
          }
          "RECALL_SIDECAR_NODE_EXECUTABLE=$nodeExe" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Windows recording depends on a real PE sidecar launcher. Tauri's
      # `bundle.externalBin` now requires this file to exist for each target
      # triple, so build and assert it before the bundle step rather than
      # publishing an installer with the Recall bridge resources but no launcher.
      - name: Build Recall SDK sidecar (${{ matrix.target }})
        shell: pwsh
        env:
          RECALL_SIDECAR_TARGET: ${{ matrix.target }}
        run: |
          pnpm -C sidecar/recall-sdk-bridge build
          $launcher = "src-tauri/binaries/recall-desktop-sdk-${{ matrix.target }}.exe"
          if (-not (Test-Path $launcher)) {
            throw "Recall sidecar launcher was not produced for ${{ matrix.target }} at $launcher"
          }

      - name: Generate Windows MSI version overlay
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_MSI_VERSION: ${{ needs.validate.outputs.msi_version }}
        run: |
          $configPath = Join-Path $env:RUNNER_TEMP "tauri.windows.msi-version.conf.json"
          node ../../scripts/windows-msi-version.mjs --version $env:APP_VERSION --output $configPath
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to generate Windows MSI version overlay"
          }

          $actual = (Get-Content $configPath -Raw | ConvertFrom-Json).bundle.windows.wix.version
          if ($actual -ne $env:EXPECTED_MSI_VERSION) {
            throw "Generated MSI ProductVersion $actual does not match validated $env:EXPECTED_MSI_VERSION"
          }

          "TAURI_MSI_VERSION_CONFIG=$configPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Windows MSI ProductVersion: $actual"

      - name: Tauri build (${{ matrix.target }})
        # The release-only overlay carries the Recall externalBin (a per-target PE
        # launcher built by the step above). It is kept out of the auto-merged
        # tauri.windows.conf.json so `cargo check` (windows-check.yml) — where the
        # launcher is absent — still passes; Tauri merges the overlay here.
        env:
          # Tauri runs the overlay's beforeBuildCommand, which builds the launcher
          # again. Keep that nested build on the matrix architecture as well.
          RECALL_SIDECAR_TARGET: ${{ matrix.target }}
        run: pnpm tauri build --target ${{ matrix.target }} --bundles msi nsis updater --config src-tauri/tauri.windows.conf.json --config src-tauri/tauri.windows.release.conf.json --config $env:TAURI_MSI_VERSION_CONFIG

      - name: Install Sentry CLI
        shell: pwsh
        run: npm install --global @sentry/cli@3.6.2

      - name: Verify Windows debug file contract
        shell: pwsh
        run: |
          $releaseDir = "src-tauri\target\${{ matrix.target }}\release"
          $exe = Join-Path $releaseDir "hq-sync-menubar.exe"
          $pdb = Join-Path $releaseDir "hq_sync_menubar.pdb"
          if (-not (Test-Path $exe)) {
            throw "Required release executable is missing: $exe"
          }
          if (-not (Test-Path $pdb)) {
            throw "Required release PDB is missing: $pdb"
          }
          $exeMetadata = (& sentry-cli difutil check --json $exe | ConvertFrom-Json)
          $pdbMetadata = (& sentry-cli difutil check --json $pdb | ConvertFrom-Json)
          $exeDebugIds = @($exeMetadata.variants | ForEach-Object { $_.debug_id } | Where-Object { $_ } | Sort-Object -Unique)
          $pdbDebugIds = @($pdbMetadata.variants | ForEach-Object { $_.debug_id } | Where-Object { $_ } | Sort-Object -Unique)
          $exeDebugId = $exeDebugIds -join ","
          $pdbDebugId = $pdbDebugIds -join ","
          if (-not $exeDebugId -or -not $pdbDebugId -or $exeDebugId -ne $pdbDebugId) {
            throw "Release executable and PDB debug ids differ: exe=$exeDebugId pdb=$pdbDebugId"
          }
          Write-Host "Windows executable/PDB debug id: $exeDebugId"

      - name: Upload Windows debug files to Sentry
        shell: pwsh
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          $releaseDir = "src-tauri\target\${{ matrix.target }}\release"
          $exe = Join-Path $releaseDir "hq-sync-menubar.exe"
          $metadata = (& sentry-cli difutil check --json $exe | ConvertFrom-Json)
          $debugIds = @($metadata.variants | ForEach-Object { $_.debug_id } | Where-Object { $_ } | Sort-Object -Unique)
          $debugId = $debugIds -join ","
          if ([string]::IsNullOrWhiteSpace($env:SENTRY_AUTH_TOKEN)) {
            $message = "SENTRY_AUTH_TOKEN is not configured; debug id $debugId was not uploaded and no recoverable debug file was retained."
            Write-Host "::warning::$message"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $message
            exit 0
          }
          & sentry-cli debug-files upload --org indigo-d0 --project hq-desktop --no-sources --wait-for 60 $releaseDir
          if ($LASTEXITCODE -ne 0) {
            $message = "SENTRY_AUTH_TOKEN is invalid or upload failed; debug id $debugId was not uploaded and no recoverable debug file was retained."
            Write-Host "::warning::$message"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $message
            exit 0
          }

          $headers = @{
            Authorization = "Bearer $env:SENTRY_AUTH_TOKEN"
            Accept = "application/json"
          }
          $endpoint = "https://sentry.io/api/0/projects/indigo-d0/hq-desktop/files/dsyms/"
          foreach ($expectedDebugId in $debugIds) {
            $encodedDebugId = [uri]::EscapeDataString($expectedDebugId)
            $records = @(Invoke-RestMethod -Uri "$endpoint?debug_id=$encodedDebugId" -Headers $headers -Method Get -TimeoutSec 30)
            $matchingRecords = @($records | Where-Object { $_.debugId -ieq $expectedDebugId })
            if ($matchingRecords.Count -eq 0) {
              throw "Sentry debug-file listing is missing uploaded debug id $expectedDebugId"
            }
            Write-Host "Verified Sentry debug-file record for $expectedDebugId"
          }

      - name: Azure login (OIDC)
        if: ${{ vars.AZURE_CLIENT_ID != '' && env.UNVERIFIED_RELEASE != 'true' }}
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign MSI (Azure Trusted Signing)
        if: ${{ vars.AZURE_CLIENT_ID != '' && env.UNVERIFIED_RELEASE != 'true' }}
        uses: azure/trusted-signing-action@v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: indigosigning
          certificate-profile-name: indigo-codesign
          files-folder: ${{ github.workspace }}\apps\sync\src-tauri\target\${{ matrix.target }}\release\bundle\msi
          files-folder-filter: msi
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign NSIS setup (Azure Trusted Signing)
        if: ${{ vars.AZURE_CLIENT_ID != '' && env.UNVERIFIED_RELEASE != 'true' }}
        uses: azure/trusted-signing-action@v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: indigosigning
          certificate-profile-name: indigo-codesign
          files-folder: ${{ github.workspace }}\apps\sync\src-tauri\target\${{ matrix.target }}\release\bundle\nsis
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Regenerate updater signatures (post-Authenticode)
        if: ${{ vars.AZURE_CLIENT_ID != '' && env.UNVERIFIED_RELEASE != 'true' }}
        shell: pwsh
        run: |
          $bundleDir = "src-tauri\target\${{ matrix.target }}\release\bundle"
          $targets = @()
          $targets += Get-ChildItem -Path "$bundleDir\nsis" -Filter '*-setup.exe' -File -ErrorAction SilentlyContinue
          $targets += Get-ChildItem -Path "$bundleDir\msi" -Filter '*.msi' -File -ErrorAction SilentlyContinue
          $targets = $targets | Where-Object { Test-Path "$($_.FullName).sig" }
          if (-not $targets) { Write-Warning "No updater .sig artifacts found to regenerate." }
          foreach ($target in $targets) {
            Write-Host "Re-signing updater signature for $($target.Name)"
            & "node_modules\.bin\tauri.cmd" signer sign "$($target.FullName)"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "tauri signer sign failed on $($target.Name)"
              exit 1
            }
          }

      - name: Stage Windows artifacts
        shell: pwsh
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          $tag = $env:TAG
          $version = $tag.TrimStart("v")
          $arch = if ("${{ matrix.target }}" -like "x86_64-*") { "x64" } else { "arm64" }
          $stage = Join-Path $env:GITHUB_WORKSPACE "release-artifacts-${{ matrix.target }}"
          $bundleDir = "src-tauri\target\${{ matrix.target }}\release\bundle"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          $nsis = Get-ChildItem -Path "$bundleDir\nsis" -Filter '*-setup.exe' -File -ErrorAction Stop | Select-Object -First 1
          $msi = Get-ChildItem -Path "$bundleDir\msi" -Filter '*.msi' -File -ErrorAction Stop | Select-Object -First 1

          $nsisName = "HQ_${version}_${arch}-setup.exe"
          $msiName = "HQ_${version}_${arch}.msi"
          Copy-Item $nsis.FullName (Join-Path $stage $nsisName)
          Copy-Item $msi.FullName (Join-Path $stage $msiName)

          foreach ($source in @($nsis, $msi)) {
            $sig = "$($source.FullName).sig"
            if (-not (Test-Path $sig)) {
              throw "Required updater signature is missing: $sig"
            }
            $destName = if ($source.Extension -eq ".msi") { "$msiName.sig" } else { "$nsisName.sig" }
            Copy-Item $sig (Join-Path $stage $destName)
          }

          Get-ChildItem -Path $stage | ForEach-Object { Write-Host "Staged: $($_.Name)" }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hq-windows-${{ matrix.target }}
          if-no-files-found: error
          path: release-artifacts-${{ matrix.target }}/

  publish:
    name: Publish GitHub release
    needs: [validate, macos, windows]
    concurrency:
      # Serialize all tags, not only reruns of one tag. Otherwise two stable
      # builds can finish out of order and the older one can replace latest.
      group: release-publication
      cancel-in-progress: false
    # A desktop release is one cross-platform product. Never publish a partial
    # release or updater manifest: macOS and the complete Windows matrix must
    # both finish successfully.
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.macos.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - name: Checkout release control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-control
          sparse-checkout: |
            scripts/release-asset-contract.mjs
            scripts/release-stable-order.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download macOS release artifacts
        uses: actions/download-artifact@v4
        with:
          name: hq-macos-universal
          path: artifacts/hq-macos-universal

      - name: Download Windows x64 release artifacts
        uses: actions/download-artifact@v4
        with:
          name: hq-windows-x86_64-pc-windows-msvc
          path: artifacts/hq-windows-x86_64-pc-windows-msvc

      - name: Download Windows ARM64 release artifacts
        uses: actions/download-artifact@v4
        with:
          name: hq-windows-aarch64-pc-windows-msvc
          path: artifacts/hq-windows-aarch64-pc-windows-msvc

      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -print0 | xargs -0 -I {} cp {} release/
          ls -la release

      - name: Validate complete release artifact set
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          VERSION="$VERSION" node --input-type=module <<'NODE'
          import fs from "node:fs";

          const version = process.env.VERSION;
          const expected = [
            `HQ_${version}_arm64-setup.exe`,
            `HQ_${version}_arm64-setup.exe.sig`,
            `HQ_${version}_arm64.msi`,
            `HQ_${version}_arm64.msi.sig`,
            `HQ_${version}_universal.app.tar.gz`,
            `HQ_${version}_universal.app.tar.gz.sig`,
            `HQ_${version}_universal.dmg`,
            `HQ_${version}_x64-setup.exe`,
            `HQ_${version}_x64-setup.exe.sig`,
            `HQ_${version}_x64.msi`,
            `HQ_${version}_x64.msi.sig`,
          ].sort();
          const actual = fs.readdirSync("release").sort();
          const missing = expected.filter((name) => !actual.includes(name));
          const unexpected = actual.filter((name) => !expected.includes(name));

          if (missing.length || unexpected.length) {
            console.error(`::error::Incomplete release artifact set. Missing: ${missing.join(", ") || "none"}; unexpected: ${unexpected.join(", ") || "none"}`);
            process.exit(1);
          }

          for (const name of expected.filter((entry) => entry.endsWith(".sig"))) {
            if (!fs.readFileSync(`release/${name}`, "utf8").trim()) {
              console.error(`::error::Updater signature is empty: ${name}`);
              process.exit(1);
            }
          }

          console.log(`Validated all ${expected.length} versioned release artifacts for ${version}`);
          NODE

      - name: Generate latest.json
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          BASE="https://github.com/${REPOSITORY}/releases/download/${TAG}"

          # The preceding completeness gate guarantees one signed universal
          # macOS archive and both signed Windows updater installers.
          MAC_TAR_PATH="release/HQ_${VERSION}_universal.app.tar.gz" \
          MAC_SIG_PATH="release/HQ_${VERSION}_universal.app.tar.gz.sig" \
          WIN_X64_EXE_PATH="release/HQ_${VERSION}_x64-setup.exe" \
          WIN_X64_SIG_PATH="release/HQ_${VERSION}_x64-setup.exe.sig" \
          WIN_ARM64_EXE_PATH="release/HQ_${VERSION}_arm64-setup.exe" \
          WIN_ARM64_SIG_PATH="release/HQ_${VERSION}_arm64-setup.exe.sig" \
          VERSION="$VERSION" \
          TAG="$TAG" \
          BASE="$BASE" \
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const readSig = (path) => {
            const signature = fs.readFileSync(path, "utf8").trim();
            if (!signature) {
              throw new Error(`Updater signature is empty: ${path}`);
            }
            return signature;
          };
          const version = process.env.VERSION;
          const tag = process.env.TAG;
          const base = process.env.BASE;

          // macOS — one universal archive serves both arches.
          const macSig = readSig(process.env.MAC_SIG_PATH);
          const macUrl = `${base}/HQ_${version}_universal.app.tar.gz`;
          const platforms = {
            "darwin-aarch64": { signature: macSig, url: macUrl },
            "darwin-x86_64": { signature: macSig, url: macUrl },
            "windows-x86_64": {
              signature: readSig(process.env.WIN_X64_SIG_PATH),
              url: `${base}/HQ_${version}_x64-setup.exe`,
            },
            "windows-aarch64": {
              signature: readSig(process.env.WIN_ARM64_SIG_PATH),
              url: `${base}/HQ_${version}_arm64-setup.exe`,
            },
          };

          const manifest = {
            version,
            notes: `See https://github.com/${process.env.GITHUB_REPOSITORY}/releases/tag/${tag}`,
            pub_date: new Date().toISOString().replace(/\.\d{3}Z$/, "Z"),
            platforms,
          };

          fs.writeFileSync("release/latest.json", `${JSON.stringify(manifest, null, 2)}\n`);
          console.log(`latest.json platforms: ${Object.keys(platforms).join(", ")}`);
          NODE

          cat release/latest.json

      # Versionless download aliases — give stable
      # https://github.com/indigoai-us/hq-desktop-app/releases/latest/download/<name>
      # URLs (GitHub redirects /releases/latest/download/ to the newest release),
      # so marketing/download links never need the version. The auto-updater
      # itself uses latest.json (which carries the versioned asset URLs); these
      # aliases are for direct human downloads. Mirrors the hq-installer pattern.
      - name: Create versionless download aliases
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          cd release
          cp "HQ_${VERSION}_universal.dmg" HQ.dmg
          cp "HQ_${VERSION}_x64-setup.exe" HQ_x64-setup.exe
          cp "HQ_${VERSION}_arm64-setup.exe" HQ_arm64-setup.exe

      # Creating a public release before all files finish uploading can expose
      # a partial product if the runner dies mid-upload. Resolve the tag across
      # authenticated paginated release results (which include drafts), then
      # mutate only a missing or hidden-draft release.
      - name: Resolve atomic release state
        id: release-plan
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          releases_json="${RUNNER_TEMP}/github-releases.json"
          plan_json="${RUNNER_TEMP}/release-plan.json"

          gh api --paginate --slurp \
            "repos/${REPOSITORY}/releases?per_page=100" \
            > "$releases_json"
          node .release-control/scripts/release-asset-contract.mjs plan \
            --releases "$releases_json" \
            --directory release \
            --tag "$TAG" \
            --prerelease "$PRERELEASE" \
            > "$plan_json"
          cat "$plan_json"

          action="$(jq -r '.action' "$plan_json")"
          release_id="$(jq -r '.releaseId // ""' "$plan_json")"
          case "$action" in
            create-draft)
              test -z "$release_id"
              ;;
            reset-draft|already-published)
              [[ "$release_id" =~ ^[0-9]+$ ]]
              ;;
            *)
              echo "::error::Invalid release plan action: ${action}"
              exit 1
              ;;
          esac

          echo "action=${action}" >> "$GITHUB_OUTPUT"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

      - name: Create or reset hidden draft GitHub release
        id: draft-release
        if: ${{ steps.release-plan.outputs.action != 'already-published' }}
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_ACTION: ${{ steps.release-plan.outputs.action }}
          PLANNED_RELEASE_ID: ${{ steps.release-plan.outputs.release_id }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_ACTION" = "create-draft" ]; then
            release_json="$(
              jq -n \
                --arg tag "$TAG" \
                --arg name "HQ ${TAG}" \
                --argjson prerelease "$PRERELEASE" \
                '{
                  tag_name: $tag,
                  name: $name,
                  draft: true,
                  prerelease: $prerelease,
                  generate_release_notes: true
                }' |
                gh api --method POST "repos/${REPOSITORY}/releases" --input -
            )"
            release_id="$(jq -r '.id' <<<"$release_json")"
            echo "Created hidden draft release ${TAG} (${release_id})."
          elif [ "$RELEASE_ACTION" = "reset-draft" ]; then
            release_id="$PLANNED_RELEASE_ID"
            release_json="$(
              gh api "repos/${REPOSITORY}/releases/${release_id}"
            )"
            echo "Reusing hidden draft release ${TAG} (${release_id})."
          else
            echo "::error::Refusing unsupported draft action ${RELEASE_ACTION}."
            exit 1
          fi

          if ! [[ "$release_id" =~ ^[0-9]+$ ]]; then
            echo "::error::GitHub returned an invalid release id: ${release_id}"
            exit 1
          fi
          jq -e \
            --arg tag "$TAG" \
            --arg name "HQ ${TAG}" \
            --argjson prerelease "$PRERELEASE" \
            '.tag_name == $tag and .name == $name and
             .draft == true and .prerelease == $prerelease' \
            <<<"$release_json" >/dev/null

          # A failed prior attempt may have left a partial hidden draft. Empty
          # it before retrying so the remote exact-set check is deterministic.
          asset_ids="$(
            gh api --paginate \
              "repos/${REPOSITORY}/releases/${release_id}/assets?per_page=100" \
              --jq '.[].id'
          )"
          if [ -n "$asset_ids" ]; then
            while IFS= read -r asset_id; do
              gh api --method DELETE \
                "repos/${REPOSITORY}/releases/assets/${asset_id}"
            done <<<"$asset_ids"
          fi

          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

      - name: Upload complete asset set to draft
        if: ${{ steps.release-plan.outputs.action != 'already-published' }}
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" release/* -R "$REPOSITORY"

      - name: Verify exact draft release asset set
        if: ${{ steps.release-plan.outputs.action != 'already-published' }}
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          RELEASE_ID: ${{ steps.draft-release.outputs.release_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_json="${RUNNER_TEMP}/draft-release.json"
          asset_json="${RUNNER_TEMP}/release-assets.json"

          verified="false"
          for attempt in 1 2 3 4 5; do
            if gh api "repos/${REPOSITORY}/releases/${RELEASE_ID}" \
                 > "$release_json" &&
               gh api --paginate --slurp \
                 "repos/${REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
                 > "$asset_json" &&
               node .release-control/scripts/release-asset-contract.mjs verify \
                 --release "$release_json" \
                 --assets "$asset_json" \
                 --directory release \
                 --tag "$TAG" \
                 --prerelease "$PRERELEASE" \
                 --draft true \
                 --match-bytes true; then
              verified="true"
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep 2
            fi
          done
          if [ "$verified" != "true" ]; then
            echo "::error::Hidden draft never reached the complete uploaded asset contract."
            exit 1
          fi

      # The early validation protects against obvious rollbacks before the
      # expensive native builds. This second check runs inside the global
      # publication lock immediately before the only public-state mutation.
      - name: Revalidate stable publication order
        if: ${{ needs.validate.outputs.channel == 'stable' && steps.release-plan.outputs.action != 'already-published' }}
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          node .release-control/scripts/release-stable-order.mjs stable-order \
            --repository "$TARGET_REPOSITORY" \
            --tag "$TARGET_TAG"

      - name: Publish verified GitHub release
        if: ${{ steps.release-plan.outputs.action != 'already-published' }}
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          MAKE_LATEST: ${{ needs.validate.outputs.make_latest }}
          RELEASE_ID: ${{ steps.draft-release.outputs.release_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_json="$(
            jq -n \
              --argjson prerelease "$PRERELEASE" \
              --arg make_latest "$MAKE_LATEST" \
              '{
                draft: false,
                prerelease: $prerelease,
                make_latest: $make_latest
              }' |
              gh api --method PATCH \
                "repos/${REPOSITORY}/releases/${RELEASE_ID}" \
                --input -
          )"

          jq -e \
            --arg tag "$TAG" \
            --argjson prerelease "$PRERELEASE" \
            '.tag_name == $tag and .draft == false and .prerelease == $prerelease' \
            <<<"$release_json" >/dev/null
          echo "Published verified release ${TAG} (prerelease=${PRERELEASE}, make_latest=${MAKE_LATEST})."

      # This also makes an ambiguous rerun idempotent: if GitHub published but
      # the previous runner lost the PATCH response, the resolver accepts the
      # already-public release only after its remote-only contract is healthy.
      - name: Confirm public release and channel isolation
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          MAKE_LATEST: ${{ needs.validate.outputs.make_latest }}
          REPOSITORY: ${{ github.repository }}
          PLANNED_RELEASE_ID: ${{ steps.release-plan.outputs.release_id }}
          DRAFT_RELEASE_ID: ${{ steps.draft-release.outputs.release_id }}
          RELEASE_ACTION: ${{ steps.release-plan.outputs.action }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_ACTION" = "already-published" ]; then
            release_id="$PLANNED_RELEASE_ID"
            match_bytes="false"
          else
            release_id="$DRAFT_RELEASE_ID"
            match_bytes="true"
          fi
          if ! [[ "$release_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Cannot confirm invalid release id ${release_id}."
            exit 1
          fi

          release_json="${RUNNER_TEMP}/public-release.json"
          asset_json="${RUNNER_TEMP}/public-release-assets.json"
          verified="false"
          for attempt in 1 2 3 4 5; do
            if gh api "repos/${REPOSITORY}/releases/${release_id}" \
                 > "$release_json" &&
               gh api --paginate --slurp \
                 "repos/${REPOSITORY}/releases/${release_id}/assets?per_page=100" \
                 > "$asset_json" &&
               node .release-control/scripts/release-asset-contract.mjs verify \
                 --release "$release_json" \
                 --assets "$asset_json" \
                 --directory release \
                 --tag "$TAG" \
                 --prerelease "$PRERELEASE" \
                 --draft false \
                 --match-bytes "$match_bytes"; then
              verified="true"
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep 2
            fi
          done
          if [ "$verified" != "true" ]; then
            echo "::error::Public release never reached the verified asset contract."
            exit 1
          fi
          node .release-control/scripts/release-asset-contract.mjs manifest \
            --repository "$REPOSITORY" \
            --tag "$TAG" \
            --version "$VERSION"
          node .release-control/scripts/release-stable-order.mjs confirm-channel \
            --repository "$REPOSITORY" \
            --tag "$TAG" \
            --make-latest "$MAKE_LATEST"
