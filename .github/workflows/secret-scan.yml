# Secret scanning (SOC 2 CC7.1). Report-only.
#
# Scans the commits a pull request adds, and the commits each push to main
# adds, with gitleaks. Findings go to the job summary (secrets redacted) and a
# JSON artifact. The job is continue-on-error and is NOT a required check, so
# it never blocks a merge. Make it required only after the baseline is clean
# and the owner approves the ruleset change.
#
# Uses the gitleaks CLI from its GitHub release (checksum-pinned) instead of
# gitleaks/gitleaks-action, which needs a paid license key on org repos.
name: Secret scan

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: "8.28.0"
  GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"

jobs:
  gitleaks:
    name: gitleaks (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -uo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            range="-1 ${PUSH_AFTER}"
          fi
          echo "Scanning commit range: $range"
          report="$RUNNER_TEMP/gitleaks-report.json"
          "$RUNNER_TEMP/gitleaks" git . \
            --log-opts="$range" \
            --redact \
            --no-banner \
            --exit-code 1 \
            --report-format json \
            --report-path "$report"
          status=$?
          count=$(jq 'length' "$report" 2>/dev/null || echo 0)
          {
            echo "## gitleaks (report only)"
            echo
            echo "Range: \`$range\`. Findings: **$count**."
            if [ "$count" != "0" ]; then
              echo
              echo "| Rule | File | Line | Commit |"
              echo "|---|---|---|---|"
              jq -r '.[] | "| \(.RuleID) | \(.File) | \(.StartLine) | \(.Commit[0:12]) |"' "$report"
              echo
              echo "Values are redacted. Rotate any real credential, then remove it or add a reviewed allowlist entry."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" != "0" ]; then
            echo "::warning title=gitleaks::$count potential secret(s) found. See the job summary."
          fi
          # Report only: findings (exit 1) never fail the job. Fail only when
          # gitleaks itself errors, so a broken scanner is visible.
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            exit "$status"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 14
