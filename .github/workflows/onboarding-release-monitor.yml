name: Onboarding release monitor

# Runner variables (repo-level Actions variables; docs/ci/self-hosted-runners.md).
# Every job reads its runs-on from one of these. Unset means the current hosted
# label, so nothing queues on a pool that does not exist yet:
#   HQ_DESKTOP_RUNNER_LINUX          ["self-hosted","linux","X64","indigo-x64"]           default "ubuntu-latest"
# Set a variable to the JSON array (or a JSON string label) to move every job
# that reads it. Job names, and so required check names, do not change.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Onboarding and public release smoke
    runs-on: ${{ fromJSON(vars.HQ_DESKTOP_RUNNER_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify final-step onboarding contract
        working-directory: apps/sync
        run: >-
          pnpm exec vitest run
          src/components/onboarding/OnboardingWizard.test.ts
          src/lib/onboarding-wizard.test.ts
      - name: Install layout regression browsers
        working-directory: apps/sync
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Verify desktop scroll containment
        working-directory: apps/sync
        run: pnpm test:e2e:browser
      - name: Verify published updater and installer links
        run: pnpm exec tsx scripts/onboarding-release-monitor.ts
