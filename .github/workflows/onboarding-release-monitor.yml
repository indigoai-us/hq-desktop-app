name: Onboarding release monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Onboarding and public release smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify final-step onboarding contract
        working-directory: apps/sync
        run: >-
          pnpm exec vitest run
          src/components/onboarding/OnboardingWizard.test.ts
          src/lib/onboarding-wizard.test.ts
      - name: Install layout regression browsers
        working-directory: apps/sync
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Verify desktop scroll containment
        working-directory: apps/sync
        run: pnpm test:e2e:browser
      - name: Verify published updater and installer links
        run: pnpm exec tsx scripts/onboarding-release-monitor.ts
