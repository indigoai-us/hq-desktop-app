# Populate, on the default branch, the exact rust-cache keys that release.yml
# (tag runs) and windows-check.yml (PR runs) restore.
#
# Release builds run on tag pushes. GitHub Actions caches are scoped to the
# ref that saved them plus the default branch; a cache saved by tag vA is
# never restorable by tag vB. Without a main-branch writer, every release job
# logs "No cache found." and compiles all dependencies from scratch: macOS
# universal ~23 min, Windows x64 ~25 min, Windows arm64 ~24 min.
#
# windows-check.yml runs only on pull_request. rust-cache also adds the job
# id unless shared-key is set, so a brand-new PR always starts cold (cargo
# check 42 min cold vs 21 min warm; installer E2E 38 min cold vs 28 min
# warm). Each PR then saves its own 1.7 GB + 0.8 GB copy and blows the 10 GB
# repo cache budget.
#
# `windows-installer-release` is now restored by the two parallel release
# builds in windows-check.yml, and only the bridge one writes it back (two
# writers would just race for one entry). This warmer staying green on main is
# what keeps both off the cold path -- including the `cargo install
# tauri-driver` below, whose ~/.cargo/bin entry the bridge build republishes as
# an artifact so the E2E job needs no Rust toolchain at all.
#
# The cache key rust-cache computes includes runner OS/arch, the shared-key,
# a hash of rustc version + CARGO_*/RUST* env vars, and the lockfiles. Each
# job here must mirror the runner image, toolchain targets, env, and cargo
# invocation of the job it warms exactly.
#
# No secrets: --no-bundle skips bundling, signing, notarization, and updater
# signing. rust-cache stores only registry sources and dependency artifacts
# and prunes the workspace crate's own artifacts.
name: Warm Rust caches

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/sync/src-tauri/Cargo.toml"
      - "apps/sync/src-tauri/Cargo.lock"
      - "apps/sync/src-tauri/build.rs"
      - "apps/sync/src-tauri/src/**"
      - "apps/sync/src-tauri/capabilities/**"
      - "apps/sync/src-tauri/icons/**"
      - "apps/sync/src-tauri/tauri.conf.json"
      - "crates/**"
      - ".github/workflows/cache-warm.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/windows-check.yml"
      - "scripts/shell-hash.mjs"
      - "scripts/prune-shell-cache.mjs"
      - "apps/sync/src-tauri/tauri.windows.conf.json"
      - "apps/sync/src-tauri/tauri.windows.release.conf.json"
  schedule:
    - cron: "17 6 * * 1"   # weekly; caches unused for 7 days are evicted and stable rustc bumps change the key
  workflow_dispatch:
    inputs:
      rebuild:
        description: Build the shells even when their key is already on shell-cache (verification only; the stored shells are not replaced)
        type: boolean
        default: false

permissions:
  contents: read

# Never cancel an in-progress warm: a shell build takes 20-30 minutes and
# main merges more often than that, so cancel-in-progress threw away every
# warm before it could store anything. GitHub keeps at most one pending run
# per group (a newer push replaces the pending one), and each shell job
# no-ops when its key is already on shell-cache, so queued runs stay cheap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release-macos:
    name: Warm release macOS universal
    runs-on: macos-14
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/sync

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/sync/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Put rustup-managed cargo first on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Replace any cargo shim with rustup-managed cargo
        shell: bash
        run: |
          set -euo pipefail
          rustup_cargo="$HOME/.cargo/bin/cargo"
          if [ ! -x "$rustup_cargo" ]; then
            echo "::error::rustup-managed cargo not found at $rustup_cargo"
            exit 1
          fi

          echo "PATH=$PATH"
          echo "All cargo on PATH:"
          which -a cargo || true

          replaced=0
          while IFS= read -r c; do
            [ -n "$c" ] || continue
            if [ "$c" = "$rustup_cargo" ]; then
              continue
            fi
            target="$(readlink "$c" 2>/dev/null || true)"
            if [ "$target" = "$rustup_cargo" ]; then
              continue
            fi
            echo "Replace shim: $c (was -> '${target:-<regular file>}') -> $rustup_cargo"
            sudo rm -f "$c"
            sudo ln -sf "$rustup_cargo" "$c"
            replaced=$((replaced + 1))
          done < <(which -a cargo 2>/dev/null || true)

          if [ "$replaced" = 0 ]; then
            echo "No non-rustup cargo entries on PATH."
          fi

          which cargo
          cargo --version
          cargo metadata --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml >/dev/null

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/sync/src-tauri
          shared-key: release-macos-universal

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Recall sidecar dependencies
        run: pnpm run sidecar:install

      - name: Compile release dependencies (universal)
        run: pnpm tauri build --no-bundle --target universal-apple-darwin --config src-tauri/tauri.macos.conf.json

  release-windows:
    name: Warm release ${{ matrix.target }}
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/sync
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    env:
      RUST_BACKTRACE: 1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/sync/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/sync/src-tauri
          shared-key: release-${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Recall sidecar dependencies
        run: pnpm run sidecar:install

      - name: Download native ARM64 Node runtime for Recall launcher
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $version = node -p "process.version"
          $archiveName = "node-$version-win-arm64.zip"
          $baseUrl = "https://nodejs.org/dist/$version"
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $checksums = Join-Path $env:RUNNER_TEMP "SHASUMS256.txt"
          $extract = Join-Path $env:RUNNER_TEMP "node-$version-win-arm64"

          Invoke-WebRequest "$baseUrl/$archiveName" -OutFile $archive
          Invoke-WebRequest "$baseUrl/SHASUMS256.txt" -OutFile $checksums
          $checksumLine = Get-Content $checksums | Where-Object { $_ -match "\s+$([regex]::Escape($archiveName))$" } | Select-Object -First 1
          if (-not $checksumLine) {
            throw "No Node checksum found for $archiveName"
          }
          $expected = ($checksumLine -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Node ARM64 checksum mismatch: expected $expected, got $actual"
          }

          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP -Force
          $nodeExe = Join-Path $extract "node.exe"
          if (-not (Test-Path $nodeExe)) {
            throw "ARM64 node.exe was not extracted at $nodeExe"
          }
          "RECALL_SIDECAR_NODE_EXECUTABLE=$nodeExe" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Windows recording depends on a real PE sidecar launcher. Tauri's
      # `bundle.externalBin` now requires this file to exist for each target
      # triple, so build and assert it before the bundle step rather than
      # publishing an installer with the Recall bridge resources but no launcher.
      - name: Build Recall SDK sidecar (${{ matrix.target }})
        shell: pwsh
        env:
          RECALL_SIDECAR_TARGET: ${{ matrix.target }}
        run: |
          pnpm -C sidecar/recall-sdk-bridge build
          $launcher = "src-tauri/binaries/recall-desktop-sdk-${{ matrix.target }}.exe"
          if (-not (Test-Path $launcher)) {
            throw "Recall sidecar launcher was not produced for ${{ matrix.target }} at $launcher"
          }

      - name: Compile release dependencies (${{ matrix.target }})
        env:
          # Mirrors release.yml: Tauri runs the release overlay's
          # beforeBuildCommand, which rebuilds the launcher. Keep that nested
          # build on the matrix architecture as well.
          RECALL_SIDECAR_TARGET: ${{ matrix.target }}
        run: pnpm tauri build --no-bundle --target ${{ matrix.target }} --config src-tauri/tauri.windows.conf.json --config src-tauri/tauri.windows.release.conf.json

  windows-check-debug:
    name: Warm windows-check debug
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/sync
    env:
      RUST_BACKTRACE: 1
      HQ_SYNC_SENTRY_DSN: ""

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Version comes from the root package.json "packageManager" field;
      # passing an explicit version here too is rejected as a conflict.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/sync/pnpm-lock.yaml

      - name: Install Rust (stable, x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/sync/src-tauri
          shared-key: windows-check-debug
          cache-on-failure: true

      - name: Install JS deps
        run: pnpm install --no-frozen-lockfile

      - name: Install Recall sidecar deps (build.rs resource)
        run: pnpm run sidecar:install

      - name: Build Svelte bundle (satisfies tauri frontendDist)
        run: pnpm run build

      - name: Rust check (Windows target)
        working-directory: apps/sync/src-tauri
        run: cargo check --target x86_64-pc-windows-msvc

      - name: Build Windows test binaries
        timeout-minutes: 30
        working-directory: apps/sync/src-tauri
        run: cargo test --target x86_64-pc-windows-msvc --bins --no-run

      - name: Install Tauri WebDriver bridge
        run: cargo install tauri-driver --locked

  windows-installer-release:
    name: Warm windows-installer release
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/sync
    env:
      RUST_BACKTRACE: 1
      HQ_SYNC_SENTRY_DSN: ""
      RECALL_SIDECAR_TARGET: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/sync/pnpm-lock.yaml

      - name: Install Rust (stable, x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/sync/src-tauri
          shared-key: windows-installer-release
          cache-on-failure: true

      - name: Install JS deps
        run: pnpm install --no-frozen-lockfile

      - name: Install Recall sidecar deps
        run: pnpm run sidecar:install

      - name: Install Tauri WebDriver bridge
        run: cargo install tauri-driver --locked

      - name: Compile release dependencies (x86_64-pc-windows-msvc)
        run: pnpm tauri build --no-bundle --target x86_64-pc-windows-msvc --config src-tauri/tauri.windows.conf.json --config src-tauri/tauri.windows.release.conf.json --config src-tauri/tauri.windows.ci.conf.json --features e2e-automation

  # The three jobs below build and store the exact `shell-*` caches
  # release.yml's shell-macos/shell-windows-x64/shell-windows-arm64 jobs
  # restore, keyed by the same scripts/shell-hash.mjs content hash (not the
  # coarser Cargo.lock/rustc-only key the release-macos/release-windows jobs
  # above warm). Skipped early, cheaply, when the shell key is unchanged
  # since the last warm — "on every push whose shell key changed" per the
  # brief, without re-running a 24-minute build on every main push.
  warm-shell-macos:
    name: Warm prebuilt shell (macOS universal)
    runs-on: macos-14
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: apps/sync
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Compute shell key
        id: key
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          TOOLCHAIN="$(rustc --version | awk '{print $2}')"
          TARGET="universal-apple-darwin"
          KEY="$(node scripts/shell-hash.mjs --root "$GITHUB_WORKSPACE" --toolchain "$TOOLCHAIN" --target "$TARGET")"
          if ! [[ "$KEY" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::shell-hash.mjs returned an invalid key: $KEY"
            exit 1
          fi
          {
            echo "key=$KEY"
            echo "toolchain=$TOOLCHAIN"
          } >> "$GITHUB_OUTPUT"
          # Build with exactly the toolchain the key names (rust-toolchain.toml
          # pins only "stable"), as release.yml's shell jobs do.
          echo "RUSTUP_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "macOS shell key $KEY (rustc $TOOLCHAIN)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check whether this key is already warm
        id: warm
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          SHELL_KEY: ${{ steps.key.outputs.key }}
        run: |
          set -euo pipefail
          ASSET="shell-macos-${SHELL_KEY}.tar.gz"
          if gh release view shell-cache -R "$REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq "$ASSET"; then
            echo "already-warm=true" >> "$GITHUB_OUTPUT"
            echo "$ASSET already exists; nothing to warm."
          else
            echo "already-warm=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.warm.outputs.already-warm != 'true' || inputs.rebuild

      - uses: actions/setup-node@v4
        if: steps.warm.outputs.already-warm != 'true' || inputs.rebuild
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/sync/pnpm-lock.yaml

      - uses: ./.github/actions/pinned-rust-toolchain
        if: steps.warm.outputs.already-warm != 'true' || inputs.rebuild
        with:
          toolchain: ${{ steps.key.outputs.toolchain }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        if: steps.warm.outputs.already-warm != 'true' || inputs.rebuild
        run: pnpm install --frozen-lockfile

      - name: Install Recall sidecar dependencies
        if: steps.warm.outputs.already-warm != 'true' || inputs.rebuild
        run: pnpm run sidecar:install

      - name: Stamp build commit identity
        if: steps.warm.outputs.already-warm != 'true' || inputs.rebuild
        shell: bash
        run: |
          set -euo pipefail
          echo "HQ_BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build unsigned universal shell
        if: steps.warm.outputs.already-warm != 'true' || inputs.rebuild
        env:
          HQ_SYNC_SENTRY_DSN: ${{ secrets.HQ_SYNC_SENTRY_DSN }}
        run: |
          pnpm tauri build --target universal-apple-darwin --bundles app \
            --config '{"build":{"beforeBuildCommand":""},"bundle":{"createUpdaterArtifacts":false}}'

      - name: Package shell
        if: steps.warm.outputs.already-warm != 'true' || inputs.rebuild
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/shell-out"
          tar -C src-tauri/target/universal-apple-darwin/release/bundle/macos -czf "$GITHUB_WORKSPACE/shell-out/shell-macos.tar.gz" HQ.app

      - name: Save shell to the Actions cache
        if: steps.warm.outputs.already-warm != 'true'
        uses: actions/cache/save@v4
        with:
          path: shell-out/shell-macos.tar.gz
          key: shell-macos-${{ steps.key.outputs.key }}

      - name: Upload shell to the shell-cache release
        if: steps.warm.outputs.already-warm != 'true'
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          SHELL_KEY: ${{ steps.key.outputs.key }}
        run: |
          set -euo pipefail
          ASSET="shell-macos-${SHELL_KEY}.tar.gz"
          if ! gh release view shell-cache -R "$REPOSITORY" >/dev/null 2>&1; then
            gh release create shell-cache -R "$REPOSITORY" --prerelease --latest=false \
              --title "Shell cache" \
              --notes "Build cache for the prebuilt macOS/Windows app shell, keyed by scripts/shell-hash.mjs. Not a release; never install from here." \
              || gh release view shell-cache -R "$REPOSITORY" >/dev/null
          fi
          cp shell-out/shell-macos.tar.gz "$RUNNER_TEMP/$ASSET"
          for attempt in 1 2 3 4 5; do
            if gh release upload shell-cache "$RUNNER_TEMP/$ASSET" -R "$REPOSITORY" --clobber; then
              echo "Uploaded $ASSET to the shell-cache release."
              exit 0
            fi
            echo "::warning::Upload of $ASSET failed (attempt $attempt/5); retrying."
            sleep $((attempt * 10))
          done
          echo "::error::Upload of $ASSET to shell-cache failed after 5 attempts."
          exit 1

      - name: Prune old macos shells from the shell-cache release
        if: steps.warm.outputs.already-warm != 'true'
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          CURRENT_KEY: ${{ steps.key.outputs.key }}
        run: |
          set -uo pipefail
          if ! ASSETS="$(gh api "repos/$REPOSITORY/releases/tags/shell-cache" --jq '[.assets[] | {name, created_at, updated_at}]')"; then
            echo "::warning::Could not list shell-cache assets; skipping prune."
            exit 0
          fi
          if ! DOOMED="$(node scripts/prune-shell-cache.mjs --target macos --keep 6 --protect "$CURRENT_KEY" <<<"$ASSETS")"; then
            echo "::warning::prune-shell-cache.mjs failed; skipping prune."
            exit 0
          fi
          if [ -z "$DOOMED" ]; then
            echo "shell-cache holds at most 6 macos shells; nothing to prune."
            exit 0
          fi
          while IFS= read -r NAME; do
            if gh release delete-asset shell-cache "$NAME" -R "$REPOSITORY" -y; then
              echo "Pruned $NAME from shell-cache."
            else
              echo "::warning::Could not delete $NAME from shell-cache."
            fi
          done <<<"$DOOMED"

  warm-shell-windows-x64:
    name: Warm prebuilt shell (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_TARGET: x86_64-pc-windows-msvc
    defaults:
      run:
        working-directory: apps/sync
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Compute shell key
        id: key
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          TOOLCHAIN="$(rustc --version | awk '{print $2}')"
          KEY="$(node scripts/shell-hash.mjs --root "$GITHUB_WORKSPACE" --toolchain "$TOOLCHAIN" --target "$RUST_TARGET")"
          if ! [[ "$KEY" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::shell-hash.mjs returned an invalid key: $KEY"
            exit 1
          fi
          {
            echo "key=$KEY"
            echo "toolchain=$TOOLCHAIN"
          } >> "$GITHUB_OUTPUT"
          # Build with exactly the toolchain the key names (rust-toolchain.toml
          # pins only "stable"), as release.yml's shell jobs do.
          echo "RUSTUP_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "Windows x64 shell key $KEY (rustc $TOOLCHAIN)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check whether this key is already warm
        id: warm
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          SHELL_KEY: ${{ steps.key.outputs.key }}
        run: |
          set -euo pipefail
          ASSET="shell-windows-x64-${SHELL_KEY}.tar"
          if gh release view shell-cache -R "$REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq "$ASSET"; then
            echo "already-warm=true" >> "$GITHUB_OUTPUT"
            echo "$ASSET already exists; nothing to warm."
          else
            echo "already-warm=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.warm.outputs.already-warm != 'true' || inputs.rebuild

      - uses: actions/setup-node@v4
        if: steps.warm.outputs.already-warm != 'true' || inputs.rebuild
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/sync/pnpm-lock.yaml

      - uses: ./.github/actions/pinned-rust-toolchain
        if: steps.warm.outputs.already-warm != 'true' || inputs.rebuild
        with:
          toolchain: ${{ steps.key.outputs.toolchain }}
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        if: steps.warm.outputs.already-warm != 'true' || inputs.rebuild
        run: pnpm install --frozen-lockfile

      - name: Install Recall sidecar dependencies
        if: steps.warm.outputs.already-warm != 'true' || inputs.rebuild
        run: pnpm run sidecar:install

      - name: Build Recall SDK sidecar (x86_64-pc-windows-msvc)
        if: steps.warm.outputs.already-warm != 'true' || inputs.rebuild
        shell: pwsh
        env:
          RECALL_SIDECAR_TARGET: x86_64-pc-windows-msvc
        run: |
          pnpm -C sidecar/recall-sdk-bridge build
          $launcher = "src-tauri/binaries/recall-desktop-sdk-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path $launcher)) {
            throw "Recall sidecar launcher was not produced at $launcher"
          }

      - name: Stamp build commit identity
        if: steps.warm.outputs.already-warm != 'true' || inputs.rebuild
        shell: bash
        run: |
          set -euo pipefail
          echo "HQ_BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Compile unsigned Windows x64 shell
        if: steps.warm.outputs.already-warm != 'true' || inputs.rebuild
        env:
          HQ_SYNC_SENTRY_DSN: ${{ secrets.HQ_SYNC_SENTRY_DSN }}
          RECALL_SIDECAR_TARGET: x86_64-pc-windows-msvc
        run: pnpm tauri build --no-bundle --target x86_64-pc-windows-msvc --config src-tauri/tauri.windows.conf.json --config src-tauri/tauri.windows.release.conf.json

      - name: Package shell
        if: steps.warm.outputs.already-warm != 'true' || inputs.rebuild
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/shell-out"
          tar --force-local -C src-tauri -cf "$GITHUB_WORKSPACE/shell-out/shell-windows-x64.tar" target/x86_64-pc-windows-msvc binaries

      - name: Save shell to the Actions cache
        if: steps.warm.outputs.already-warm != 'true'
        uses: actions/cache/save@v4
        with:
          path: shell-out/shell-windows-x64.tar
          key: shell-windows-x64-${{ steps.key.outputs.key }}

      - name: Upload shell to the shell-cache release
        if: steps.warm.outputs.already-warm != 'true'
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          SHELL_KEY: ${{ steps.key.outputs.key }}
        run: |
          set -euo pipefail
          ASSET="shell-windows-x64-${SHELL_KEY}.tar"
          if ! gh release view shell-cache -R "$REPOSITORY" >/dev/null 2>&1; then
            gh release create shell-cache -R "$REPOSITORY" --prerelease --latest=false \
              --title "Shell cache" \
              --notes "Build cache for the prebuilt macOS/Windows app shell, keyed by scripts/shell-hash.mjs. Not a release; never install from here." \
              || gh release view shell-cache -R "$REPOSITORY" >/dev/null
          fi
          cp shell-out/shell-windows-x64.tar "$RUNNER_TEMP/$ASSET"
          for attempt in 1 2 3 4 5; do
            if gh release upload shell-cache "$RUNNER_TEMP/$ASSET" -R "$REPOSITORY" --clobber; then
              echo "Uploaded $ASSET to the shell-cache release."
              exit 0
            fi
            echo "::warning::Upload of $ASSET failed (attempt $attempt/5); retrying."
            sleep $((attempt * 10))
          done
          echo "::error::Upload of $ASSET to shell-cache failed after 5 attempts."
          exit 1

      - name: Prune old windows-x64 shells from the shell-cache release
        if: steps.warm.outputs.already-warm != 'true'
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          CURRENT_KEY: ${{ steps.key.outputs.key }}
        run: |
          set -uo pipefail
          if ! ASSETS="$(gh api "repos/$REPOSITORY/releases/tags/shell-cache" --jq '[.assets[] | {name, created_at, updated_at}]')"; then
            echo "::warning::Could not list shell-cache assets; skipping prune."
            exit 0
          fi
          if ! DOOMED="$(node scripts/prune-shell-cache.mjs --target windows-x64 --keep 6 --protect "$CURRENT_KEY" <<<"$ASSETS")"; then
            echo "::warning::prune-shell-cache.mjs failed; skipping prune."
            exit 0
          fi
          if [ -z "$DOOMED" ]; then
            echo "shell-cache holds at most 6 windows-x64 shells; nothing to prune."
            exit 0
          fi
          while IFS= read -r NAME; do
            if gh release delete-asset shell-cache "$NAME" -R "$REPOSITORY" -y; then
              echo "Pruned $NAME from shell-cache."
            else
              echo "::warning::Could not delete $NAME from shell-cache."
            fi
          done <<<"$DOOMED"

  warm-shell-windows-arm64:
    name: Warm prebuilt shell (Windows arm64)
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_TARGET: aarch64-pc-windows-msvc
    defaults:
      run:
        working-directory: apps/sync
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Compute shell key
        id: key
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          TOOLCHAIN="$(rustc --version | awk '{print $2}')"
          KEY="$(node scripts/shell-hash.mjs --root "$GITHUB_WORKSPACE" --toolchain "$TOOLCHAIN" --target "$RUST_TARGET")"
          if ! [[ "$KEY" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::shell-hash.mjs returned an invalid key: $KEY"
            exit 1
          fi
          {
            echo "key=$KEY"
            echo "toolchain=$TOOLCHAIN"
          } >> "$GITHUB_OUTPUT"
          # Build with exactly the toolchain the key names (rust-toolchain.toml
          # pins only "stable"), as release.yml's shell jobs do.
          echo "RUSTUP_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "Windows arm64 shell key $KEY (rustc $TOOLCHAIN)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check whether this key is already warm
        id: warm
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          SHELL_KEY: ${{ steps.key.outputs.key }}
        run: |
          set -euo pipefail
          ASSET="shell-windows-arm64-${SHELL_KEY}.tar"
          if gh release view shell-cache -R "$REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq "$ASSET"; then
            echo "already-warm=true" >> "$GITHUB_OUTPUT"
            echo "$ASSET already exists; nothing to warm."
          else
            echo "already-warm=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.warm.outputs.already-warm != 'true' || inputs.rebuild

      - uses: actions/setup-node@v4
        if: steps.warm.outputs.already-warm != 'true' || inputs.rebuild
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/sync/pnpm-lock.yaml

      - uses: ./.github/actions/pinned-rust-toolchain
        if: steps.warm.outputs.already-warm != 'true' || inputs.rebuild
        with:
          toolchain: ${{ steps.key.outputs.toolchain }}
          targets: aarch64-pc-windows-msvc

      - name: Install dependencies
        if: steps.warm.outputs.already-warm != 'true' || inputs.rebuild
        run: pnpm install --frozen-lockfile

      - name: Install Recall sidecar dependencies
        if: steps.warm.outputs.already-warm != 'true' || inputs.rebuild
        run: pnpm run sidecar:install

      - name: Download native ARM64 Node runtime for Recall launcher
        if: steps.warm.outputs.already-warm != 'true' || inputs.rebuild
        shell: pwsh
        run: |
          $version = node -p "process.version"
          $archiveName = "node-${version}-win-arm64.zip"
          $baseUrl = "https://nodejs.org/dist/$version"
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $checksums = Join-Path $env:RUNNER_TEMP "SHASUMS256.txt"
          $extract = Join-Path $env:RUNNER_TEMP "node-${version}-win-arm64"

          Invoke-WebRequest "$baseUrl/$archiveName" -OutFile $archive
          Invoke-WebRequest "$baseUrl/SHASUMS256.txt" -OutFile $checksums
          $checksumLine = Get-Content $checksums | Where-Object { $_ -match "\s+$([regex]::Escape($archiveName))$" } | Select-Object -First 1
          if (-not $checksumLine) {
            throw "No Node checksum found for $archiveName"
          }
          $expected = ($checksumLine -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Node ARM64 checksum mismatch: expected $expected, got $actual"
          }

          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP -Force
          $nodeExe = Join-Path $extract "node.exe"
          if (-not (Test-Path $nodeExe)) {
            throw "ARM64 node.exe was not extracted at $nodeExe"
          }
          "RECALL_SIDECAR_NODE_EXECUTABLE=$nodeExe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Recall SDK sidecar (aarch64-pc-windows-msvc)
        if: steps.warm.outputs.already-warm != 'true' || inputs.rebuild
        shell: pwsh
        env:
          RECALL_SIDECAR_TARGET: aarch64-pc-windows-msvc
        run: |
          pnpm -C sidecar/recall-sdk-bridge build
          $launcher = "src-tauri/binaries/recall-desktop-sdk-aarch64-pc-windows-msvc.exe"
          if (-not (Test-Path $launcher)) {
            throw "Recall sidecar launcher was not produced at $launcher"
          }

      - name: Stamp build commit identity
        if: steps.warm.outputs.already-warm != 'true' || inputs.rebuild
        shell: bash
        run: |
          set -euo pipefail
          echo "HQ_BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Compile unsigned Windows arm64 shell
        if: steps.warm.outputs.already-warm != 'true' || inputs.rebuild
        env:
          HQ_SYNC_SENTRY_DSN: ${{ secrets.HQ_SYNC_SENTRY_DSN }}
          RECALL_SIDECAR_TARGET: aarch64-pc-windows-msvc
        run: pnpm tauri build --no-bundle --target aarch64-pc-windows-msvc --config src-tauri/tauri.windows.conf.json --config src-tauri/tauri.windows.release.conf.json

      - name: Package shell
        if: steps.warm.outputs.already-warm != 'true' || inputs.rebuild
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/shell-out"
          tar --force-local -C src-tauri -cf "$GITHUB_WORKSPACE/shell-out/shell-windows-arm64.tar" target/aarch64-pc-windows-msvc binaries

      - name: Save shell to the Actions cache
        if: steps.warm.outputs.already-warm != 'true'
        uses: actions/cache/save@v4
        with:
          path: shell-out/shell-windows-arm64.tar
          key: shell-windows-arm64-${{ steps.key.outputs.key }}

      - name: Upload shell to the shell-cache release
        if: steps.warm.outputs.already-warm != 'true'
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          SHELL_KEY: ${{ steps.key.outputs.key }}
        run: |
          set -euo pipefail
          ASSET="shell-windows-arm64-${SHELL_KEY}.tar"
          if ! gh release view shell-cache -R "$REPOSITORY" >/dev/null 2>&1; then
            gh release create shell-cache -R "$REPOSITORY" --prerelease --latest=false \
              --title "Shell cache" \
              --notes "Build cache for the prebuilt macOS/Windows app shell, keyed by scripts/shell-hash.mjs. Not a release; never install from here." \
              || gh release view shell-cache -R "$REPOSITORY" >/dev/null
          fi
          cp shell-out/shell-windows-arm64.tar "$RUNNER_TEMP/$ASSET"
          for attempt in 1 2 3 4 5; do
            if gh release upload shell-cache "$RUNNER_TEMP/$ASSET" -R "$REPOSITORY" --clobber; then
              echo "Uploaded $ASSET to the shell-cache release."
              exit 0
            fi
            echo "::warning::Upload of $ASSET failed (attempt $attempt/5); retrying."
            sleep $((attempt * 10))
          done
          echo "::error::Upload of $ASSET to shell-cache failed after 5 attempts."
          exit 1

      - name: Prune old windows-arm64 shells from the shell-cache release
        if: steps.warm.outputs.already-warm != 'true'
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          CURRENT_KEY: ${{ steps.key.outputs.key }}
        run: |
          set -uo pipefail
          if ! ASSETS="$(gh api "repos/$REPOSITORY/releases/tags/shell-cache" --jq '[.assets[] | {name, created_at, updated_at}]')"; then
            echo "::warning::Could not list shell-cache assets; skipping prune."
            exit 0
          fi
          if ! DOOMED="$(node scripts/prune-shell-cache.mjs --target windows-arm64 --keep 6 --protect "$CURRENT_KEY" <<<"$ASSETS")"; then
            echo "::warning::prune-shell-cache.mjs failed; skipping prune."
            exit 0
          fi
          if [ -z "$DOOMED" ]; then
            echo "shell-cache holds at most 6 windows-arm64 shells; nothing to prune."
            exit 0
          fi
          while IFS= read -r NAME; do
            if gh release delete-asset shell-cache "$NAME" -R "$REPOSITORY" -y; then
              echo "Pruned $NAME from shell-cache."
            else
              echo "::warning::Could not delete $NAME from shell-cache."
            fi
          done <<<"$DOOMED"
