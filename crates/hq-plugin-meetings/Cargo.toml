# Meetings & recording plugin crate — meeting detection, the Recall SDK bridge
# protocol, and the meeting/recordings ledgers, lifted out of hq-desktop-core so the
# feature owns its own logic, tests, and release cadence.
#
# Dependency direction is one-way: this crate depends on the foundation crate;
# nothing in hq-desktop-core depends on this one. Keep it that way — it is what
# makes the eventual extraction to its own repo a directory move.
[package]
name = "hq-plugin-meetings"
version = "0.1.0"
edition = "2021"

[dependencies]
hq-desktop-core = { path = "../hq-desktop-core" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
tempfile = "3"
# The meetings tests drive the shared log seam through `logfile::LogOverrideGuard`,
# which the foundation crate gates behind `test-support` so production builds carry
# no mutable log destination. Same pattern as apps/sync/src-tauri's dev-dependency.
hq-desktop-core = { path = "../hq-desktop-core", features = ["test-support"] }
