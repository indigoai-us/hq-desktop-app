[package]
name = "hq-engine-sidecar"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[dependencies]
hq-engine = { path = "../hq-engine" }
hq-engine-protocol = { path = "../hq-engine-protocol" }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
