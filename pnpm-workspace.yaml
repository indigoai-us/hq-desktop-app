# pnpm workspace for hq-desktop-app (single app: install-then-sync).
#
# Only the active app (apps/sync) participates. The port sources under imports/ are
# intentionally NOT workspace members. apps/sync still carries its own pnpm lockfile
# from import; root lockfile normalization happens as the app is finalized.
#
# US-101: do not add hq-work-mono packages as workspace members (that would pull
# them into turbo). Sync pins @hq/ui + @hq/platform + @hq/core via file: deps.
# See apps/sync/docs/hq-work-ui-consume.md.
packages:
  - "apps/sync"
