# pnpm workspace for hq-desktop-app.
#
# The port sources under imports/ are intentionally NOT workspace members.
#
# packages/{core,platform,ui} are vendored copies of the same-named packages in
# indigoai-us/hq-work-mono — see packages/VENDORED.md. They are workspace
# members so a plain `pnpm install` works on a bare checkout: the previous
# `file:` pins pointed at a sibling hq-work-mono worktree that does not exist in
# CI, which is why frontend CI could not install this repo at all.
packages:
  - "apps/sync"
  - "packages/*"
