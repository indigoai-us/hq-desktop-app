[package]
name = "hq-intro-preview"
version = "0.1.0"
edition = "2021"
description = "Standalone preview of the HQ cinematic welcome intro"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hq-platform = { path = "../../../crates/hq-platform" }
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
