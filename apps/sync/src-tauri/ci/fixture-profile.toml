# Cargo profile overlay for the Windows installer FIXTURES only.
#
# The two installer jobs in windows-check.yml copy this to
# `apps/sync/src-tauri/.cargo/config.toml` at build time. It is never copied by
# release.yml, so nothing here reaches a user.
#
# Why it lives here instead of at `.cargo/config.toml`: at that path it would
# apply to every local `cargo build` and to the release workflow, and it would
# also land in Swatinem/rust-cache's cache key (the action hashes
# `**/.cargo/config.toml`), forking a second multi-GB lane out of a 10 GB budget
# the whole repository shares.
#
# Measured on run 33651446024: of the installer build's 8m37s of cargo, 6m15s
# is one silent block -- codegen and link of the hq-sync-menubar binary alone.
# The other three workspace crates and every dependency are already cheap or
# already cached. So the override is aimed at exactly that crate.
#
# `opt-level` alone did not move that block, and NEITHER DID `debug = false`.
# Both were tried; both are recorded here so the next person does not spend the
# measurement again.
#
# Re-measured on run 35060444631, after the opt-level override had been in place
# for weeks: cargo took 8m21s, of which the stretch between the last `Compiling`
# line and hq-sync-menubar's warning summary was 446s. Only four crates compile
# at all; every dependency restores from cache. The hypothesis was that the
# block is the MSVC link writing the PDB, so run 35067622738 tried
# `debug = false` on this same package. Result: 418s, and cargo total 7m54s.
# 28 seconds, 6%. The hypothesis is wrong -- that block is not PDB emission, and
# `debug = false` was reverted rather than kept for 28s on a disproven premise.
#
# What is still unexplained, and is the actual open question: TWO independent
# profile overrides aimed at this one crate have each moved it by roughly
# nothing. Before writing a third, confirm the override reaches the build at all
# -- cargo accepts a `[profile.*.package.*]` key that matches nothing without a
# warning, and this file is copied to `.cargo/config.toml` after rust-cache has
# already keyed, which is a narrow enough path to be worth proving rather than
# assuming. If it does apply, then the cost is ordinary codegen and link of a
# very large binary, and the lever is the linker (rust-lld) or the amount of
# code, not a profile knob.
#
# IMPORTANT -- the scope below is load-bearing, not conservatism.
#
# The CI step writes this file AFTER rust-cache has computed its key, so the
# cache key does not describe this override. That is only sound while the
# override cannot change anything the cache stores. rust-cache deletes
# workspace-member artifacts before saving, so hq-sync-menubar is never in the
# cache; every dependency still builds at the profile's own opt-level and stays
# bit-identical to what the key promises.
#
# Add a dependency to this file and that stops being true: the lane would then
# hold artifacts its key does not describe, and every job restoring it --
# including release builds warmed from the same shared key -- would silently
# get them. If you need to override a dependency, put the setting in the
# workflow's env instead and accept the new cache lane.

[profile.release.package.hq-sync-menubar]
opt-level = 1
